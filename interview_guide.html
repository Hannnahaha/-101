      const hintLines = Array.isArray(topic.sourceHints) && topic.sourceHints.length
        ? topic.sourceHints.map((x) => `结合JD：${x}`)
        : ["未匹配到JD中的明确条目，建议在一级页面补充更细JD文本。"];
      return {
        core: [
          "先明确该方向在岗位中的业务价值。",
          "拆分核心问题：目标、约束、资源、风险。",
          ...hintLines
        ],
        framework: [
          "三段法：定义问题 -> 构建框架 -> 给出可执行方案。",
          "量化表达：至少包含1个指标、1个阈值、1个验证动作。"
        ],
        formula: "高质量回答 = 结构完整度 * 业务相关度 * 可执行性",
        caseDemo: [
          `围绕“${topic.title}”准备1个真实场景：现状、问题、方案、结果。`
        ],
        pitfalls: [
          "只讲概念，不讲方法与落地。",
          "只讲结论，不讲推导过程。"
        ],
        script: "我会先定义该方向的问题边界，再给拆解框架和行动方案，最后补风险和验证路径。"
      };
    }

    function extractExperienceModuleInput(payload) {
      const modules = Array.isArray(payload?.prepModules) ? payload.prepModules : [];
      const exp = modules.find((m) => String(m?.key || "").trim() === "experience");
      return String(exp?.rawText || "").trim();
    }

    function extractResumeEvidenceLinesForExperience(payload) {
      const resumeFiles = Array.isArray(payload?.learningMaterials?.resumeFiles)
        ? payload.learningMaterials.resumeFiles
        : [];
      const clean = (text) => String(text || "").replace(/\s+/g, " ").trim();
      const redactSensitive = (text) =>
        String(text || "")
          .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig, "[邮箱已省略]")
          .replace(/(?:\+?\d[\d\-\s()]{7,}\d)/g, "[电话已省略]")
          .replace(/(?:姓名|电话|手机号|邮箱|微信|住址|地址|性别|出生|籍贯|民族|婚姻|政治面貌|身份证|护照)[:：]?\s*[^\s，,；;。]{1,60}/g, "")
          .replace(/\b\d{7,}\b/g, "[数字已省略]");
      const stripLeadNoise = (text) =>
        String(text || "")
          .replace(/^[A-Za-z\u4e00-\u9fa5]{1,8}\s*[（(].*?[）)]\s*/g, "")
          .replace(/^(?:邮箱|电话|手机号|email|mail)[:：]?\s*[^\s，,；;。]+/ig, "")
          .trim();
      const isLikelyPersonalLine = (text) => {
        const t = String(text || "");
        if (!t) return true;
        if (/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i.test(t)) return true;
        if (/(?:\+?\d[\d\-\s()]{7,}\d)/.test(t)) return true;
        if (/^(姓名|电话|手机号|邮箱|微信|住址|地址|性别|出生|籍贯|民族|婚姻|政治面貌)/.test(t)) return true;
        return false;
      };
      const splitToChunks = (text) =>
        String(text || "")
          .split(/\n|。|；|;|！|!|\?|？/)
          .map((x) => clean(x))
          .filter((x) => x.length >= 12 && x.length <= 180);
      const hasActionSignal = (text) => /(负责|主导|推动|优化|搭建|分析|管理|实施|上线|提升|增长|降低|协同|设计|交付|复盘)/.test(String(text || ""));
      const lines = [];
      resumeFiles.slice(0, 8).forEach((file) => {
        const name = clean(file?.name || "");
        const parseStatus = String(file?.parseStatus || "").trim();
        if (parseStatus && parseStatus !== "success") return;
        const rawPreview = clean(file?.textPreview || "")
          .replace(/（?浏览器内暂存元数据，?完整解析需后端）?/g, "")
          .replace(/（?浏览器内暂存元数据，?完整解析需后续接入后端）?/g, "")
          .replace(/（?解析失败[:：][^）)]*）?/g, "")
          .trim();
        const withoutTypeTag = rawPreview.replace(/^\[[A-Z]+\]\s*/i, "").trim();
        const contentOnly = withoutTypeTag
          .replace(new RegExp(`^${name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\s*[|：:-]?\\s*`, "i"), "")
          .trim();
        const noSubstance = !contentOnly || contentOnly === name;
        if (noSubstance) return;
        const redacted = redactSensitive(contentOnly);
        const chunks = splitToChunks(redacted);
        const scored = chunks
          .map((rawChunk) => stripLeadNoise(rawChunk))
          .filter((chunk) => chunk && !isLikelyPersonalLine(chunk))
          .map((chunk) => ({ chunk, score: (hasActionSignal(chunk) ? 2 : 0) + (/(项目|系统|策略|指标|优化|增长|成本|效率|用户|产品|数据|复盘|落地|协同)/.test(chunk) ? 1 : 0) }))
          .sort((a, b) => b.score - a.score)
          .slice(0, 3)
          .map((x) => x.chunk);
        scored.forEach((chunk) => {
          if (!lines.includes(chunk)) lines.push(chunk);
        });
      });
      return lines;
    }

    function summarizeResumeParseStats(payload) {
      const files = Array.isArray(payload?.learningMaterials?.resumeFiles)
        ? payload.learningMaterials.resumeFiles
        : [];
      const total = files.length;
      const success = files.filter((f) => String(f?.parseStatus || "").trim() === "success").length;
      const unsupported = files.filter((f) => String(f?.parseStatus || "").trim() === "unsupported").length;
      const failed = Math.max(0, total - success - unsupported);
      return { total, success, failed, unsupported };
    }

    function resolveMergedModuleKey(topic) {
      const id = String(topic?.id || "");
      const fromId = id.match(/^topic-merged-(technical|experience|behavioral|case)$/);
      if (fromId && fromId[1]) return fromId[1];
      return normalizeModuleKey(topic);
    }

    function inferExperienceOverlapSummary(topic) {
      const payload = currentLevel1Payload || {};
      const roleName = String(payload?.roleName || "").trim();
      const sourceHints = Array.isArray(topic?.sourceHints) ? topic.sourceHints : [];
      const jdClues = extractContextFromJD(payload, topic?.title || "").slice(0, 3);
      const targetTokens = tokenizeFocus(`${roleName} ${sourceHints.join(" ")} ${jdClues.join(" ")}`);
      const resumeLines = extractResumeDigest(payload)
        .map((x) => String(x || "").replace(/^[^|]*\|/, "").trim())
        .filter(Boolean);
      const expInputLines = splitToLines(extractExperienceModuleInput(payload));
      const candidates = [...resumeLines, ...expInputLines]
        .map((x) => String(x || "").trim())
        .filter((x) => x.length >= 8)
        .slice(0, 20);
      const scored = candidates.map((line) => {
        const lower = line.toLowerCase();
        let score = 0;
        targetTokens.forEach((t) => {
          if (lower.includes(t)) score += 2;
        });
        if (/负责|推动|优化|分析|增长|转化|策略|协同|项目/.test(line)) score += 1;
        return { line, score };
      }).sort((a, b) => b.score - a.score);
      const best = scored[0]?.line || expInputLines[0] || resumeLines[0] || "";
      if (best) {
        return `识别到与你目标岗位重叠的经历：${best}`;
      }
      return "识别到与你目标岗位重叠的经历：请补充“既有经历深挖”内容并上传简历，以便更精准识别。";
    }

    function inferExperienceOverlapItems(topic) {
      const payload = currentLevel1Payload || {};
      const roleName = String(payload?.roleName || "").trim();
      const sourceHints = Array.isArray(topic?.sourceHints) ? topic.sourceHints : [];
      const jdClues = extractContextFromJD(payload, topic?.title || "").slice(0, 3);
      const targetTokens = tokenizeFocus(`${roleName} ${sourceHints.join(" ")} ${jdClues.join(" ")}`);
      const resumeLines = extractResumeEvidenceLinesForExperience(payload);
      const expInputLines = splitToLines(extractExperienceModuleInput(payload));
      const candidates = [...resumeLines, ...expInputLines]
        .map((x) => String(x || "").trim())
        .filter((x) => x.length >= 8)
        .slice(0, 24);
      const scored = candidates.map((line) => {
        const lower = line.toLowerCase();
        let score = 0;
        targetTokens.forEach((t) => {
          if (lower.includes(t)) score += 2;
        });
        if (/负责|推动|优化|分析|增长|转化|策略|协同|项目/.test(line)) score += 1;
        return { line, score };
      }).sort((a, b) => b.score - a.score);
      const unique = [];
      scored.forEach((item) => {
        const text = String(item?.line || "").trim();
        if (!text) return;
        if (unique.includes(text)) return;
        unique.push(text);
      });
      if (unique.length) return unique.slice(0, 3);
      const stats = summarizeResumeParseStats(payload);
      if (!stats.total) return ["未检测到已上传简历，请先上传简历文件。"];
      if (!stats.success) return [`已上传${stats.total}份简历，但正文解析成功0份，请更换可解析文件（推荐 PDF/TXT/DOCX/清晰图片）。`];
      return ["已检测到简历，但未识别到可匹配目标岗位的明确经历片段，请补充“既有经历深挖”文本。"];
    }

    function buildExperienceDeepDiveQuestions(topic) {
      const payload = currentLevel1Payload || {};
      const roleName = String(payload?.roleName || "").trim();
      const experienceInputLines = splitToLines(extractExperienceModuleInput(payload));
      const resumeInputLines = extractResumeEvidenceLinesForExperience(payload);
      const sourceLines = [
        ...experienceInputLines,
        ...resumeInputLines,
        ...extractContextFromJD(payload, topic?.title || "").slice(0, 4)
      ];
      const stopWords = new Set(["我们", "你们", "以及", "相关", "目标", "岗位", "能力", "经验", "项目", "负责", "进行", "通过"]);
      const keywordPool = [];
      sourceLines.forEach((line) => {
        String(line || "")
          .split(/[\s，,。；;：:（）()【】\[\]\/\-]/)
          .map((x) => x.trim())
          .filter((x) => x.length >= 2 && x.length <= 12 && !stopWords.has(x))
          .forEach((x) => {
            if (!keywordPool.includes(x)) keywordPool.push(x);
          });
      });
      const k1 = keywordPool[0] || "策略分析";
      const k2 = keywordPool[1] || "跨团队协同";
      const k3 = keywordPool[2] || "数据驱动优化";
      const deepDive = [
        `1.1 你在该段经历中具体承担了哪些与「${k1}」和「${k2}」相关的职责？请按“背景-动作-结果”展开。`,
        `1.1 该段经历里，你做过哪些关键决策能体现「${k3}」能力？当时依据是什么？`,
        "1.1 这段经历里最能体现你业务判断力的一次取舍是什么？如果重来一次你会如何优化？",
        `1.1 针对面试岗位「${roleName || "目标岗位"}」，这段经历中哪些可量化结果最值得优先讲？对应指标是多少？`
      ];
      return deepDive.slice(0, 5);
    }

    function buildExperienceMigrationQuestions(topic) {
      const payload = currentLevel1Payload || {};
      const roleName = String(payload?.roleName || "").trim();
      return [
        `2.1 在该段经历中，你认为最可迁移到「${roleName || "目标岗位"}」的3个takeaways是什么？分别能解决岗位中的什么问题？`,
        "2.1 这些takeaways里，哪一个最能体现你的方法论可复用性？请给出“可迁移场景 + 预期结果”。",
        `2.2 你认为自己距离「${roleName || "目标岗位"}」目前还存在哪些能力或经历上的gap？请至少列出2-3项。`,
        "2.2 针对每个gap，你计划如何弥合（学习/项目补齐/表达优化）？请给出时间表与验证标准。"
      ];
    }

    function buildDirection2BulletPoints(topic) {
      const payload = currentLevel1Payload || {};
      const unique = (arr) => {
        const out = [];
        (arr || []).forEach((x) => {
          const text = String(x || "").trim();
          if (!text) return;
          if (out.includes(text)) return;
          out.push(text);
        });
        return out;
      };
      const mismatchMsg = "该岗位与你的既有经历偏差过大，暂无相关建议";
      const resumeEvidence = extractResumeEvidenceLinesForExperience(payload).slice(0, 8);
      const experienceInputLines = splitToLines(extractExperienceModuleInput(payload)).slice(0, 6);
      const buildJdPersonaTokens = () => {
        const role = String(payload?.roleName || "").trim();
        const jdRaw = String(payload?.jobDescription || "");
        const jdLines = splitToLines(jdRaw);
        const personaLines = jdLines.filter((line) => /(负责|要求|能力|经验|任职|资格|加分|优先|技能|职责|岗位|画像)/.test(line));
        const tokenSource = [role, ...personaLines.slice(0, 24)].join(" ");
        const stopWords = new Set([
          "负责", "要求", "能力", "经验", "岗位", "职责", "任职", "资格", "优先", "技能", "相关", "具有", "熟悉", "能够",
          "我们", "你们", "以及", "进行", "通过", "工作", "项目", "团队", "完成", "以上"
        ]);
        return unique(tokenizeFocus(tokenSource).filter((t) => t.length >= 2 && !stopWords.has(t))).slice(0, 120);
      };
      const jdPersonaTokens = buildJdPersonaTokens();
      const evidenceTokens = unique([
        ...resumeEvidence.flatMap((x) => tokenizeFocus(x)),
        ...experienceInputLines.flatMap((x) => tokenizeFocus(x))
      ]).filter((x) => x.length >= 2);
      const overlapTokens = jdPersonaTokens.filter((t) => evidenceTokens.includes(t));
      const overlapRatio = jdPersonaTokens.length ? overlapTokens.length / jdPersonaTokens.length : 0;
      const minTokenLen = 2;
      const hasEvidenceToken = (text) => {
        const lower = String(text || "").toLowerCase();
        return evidenceTokens.some((t) => t.length >= minTokenLen && lower.includes(t));
      };
      const hasJdToken = (text) => {
        const lower = String(text || "").toLowerCase();
        return jdPersonaTokens.some((t) => t.length >= minTokenLen && lower.includes(t));
      };
      const isIndustryLike = (text) => /(行业|价值链|上游|中游|下游|竞争格局|竞品|市场份额|行业趋势|1A|1B|1C|1D|1DA|1E)/.test(String(text || ""));
      const aiExperienceBulletsRaw = unique(
        (Array.isArray(payload?.aiTopicBlueprints) ? payload.aiTopicBlueprints : [])
          .filter((x) => String(x?.moduleKey || "").trim() === "experience")
          .flatMap((x) => Array.isArray(x?.knowledge) ? x.knowledge : [])
      );
      const tooRawResumeLike = (text) =>
        /来源文件|候选经历片段|邮箱已省略|电话已省略|请补充你在该经历中的具体职责/.test(String(text || ""))
        || String(text || "").length > 220;
      const aiExperienceBullets = aiExperienceBulletsRaw
        .filter((x) => !isIndustryLike(x))
        .filter((x) => !tooRawResumeLike(x))
        .filter((x) => !evidenceTokens.length || hasEvidenceToken(x))
        .filter((x) => !jdPersonaTokens.length || hasJdToken(x));
      if (aiExperienceBullets.length >= 3) return aiExperienceBullets.slice(0, 12);
      const topicBullets = unique(Array.isArray(topic?.knowledge) ? topic.knowledge : []);
      const cleanedTopicBullets = topicBullets
        .filter((x) => !isIndustryLike(x))
        .filter((x) => !tooRawResumeLike(x))
        .filter((x) => !evidenceTokens.length || hasEvidenceToken(x))
        .filter((x) => !jdPersonaTokens.length || hasJdToken(x));
      if (cleanedTopicBullets.length >= 3) return cleanedTopicBullets.slice(0, 12);
      const roleName = String(payload?.roleName || "").trim();
      const jdHints = extractContextFromJD(payload, roleName || String(topic?.title || "")).slice(0, 2);
      const stats = summarizeResumeParseStats(payload);
      if (stats.total && !stats.success) {
        return [`已上传${stats.total}份简历，但正文解析成功0份，请回一级页面重新上传可解析格式后再生成方向2内容。`];
      }
      if (!stats.total && !experienceInputLines.length) {
        return ["方向2缺少输入：请先上传简历或补充“既有经历深挖”文本后再生成。"];
      }
      // Relax mismatch detection: only trigger when JD tokens are sufficiently rich
      // and overlap is both absolutely and relatively very low.
      if (
        jdPersonaTokens.length >= 10
        && evidenceTokens.length >= 8
        && overlapTokens.length === 0
        && overlapRatio < 0.03
      ) {
        return [mismatchMsg];
      }
      const sanitizeExperienceLine = (line) =>
        String(line || "")
          .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig, "")
          .replace(/(?:\+?\d[\d\-\s()]{7,}\d)/g, "")
          .replace(/(?:姓名|电话|手机号|邮箱|微信|住址|地址|性别|出生|籍贯|民族|婚姻|政治面貌)[:：]?\s*[^\s，,；;。]{1,60}/g, "")
          .replace(/\[[^\]]*省略[^\]]*\]/g, "")
          .replace(/\(\s*\)/g, "")
          .replace(/\s{2,}/g, " ")
          .replace(/^[，,；;：:\s]+|[，,；;：:\s]+$/g, "")
          .trim();
      const resumeConcrete = resumeEvidence
        .map((line) => sanitizeExperienceLine(line))
        .filter((x) => x && x.length >= 10)
        .slice(0, 4);
      const topPersona = jdPersonaTokens.slice(0, 8);
      const mapToJd = (line) => {
        const lower = String(line || "").toLowerCase();
        const hits = topPersona.filter((t) => lower.includes(t)).slice(0, 3);
        return hits.length ? hits.join(" / ") : "岗位关键能力（请结合JD继续细化）";
      };
      const fallbackBullets = unique([
        ...resumeConcrete.map((line) => `${line}||REASON||可映射到岗位画像中的「${mapToJd(line)}」`),
        ...experienceInputLines.slice(0, 2).map((line) => `${line}；建议补充结果指标（效率/质量/成本/收入）增强说服力。`),
        jdHints[0] ? `结合JD要求「${jdHints[0]}」，优先选择最能体现该能力的经历作为主故事。` : "",
        "可口述模板：背景-目标-关键动作-量化结果-复盘改进（60-90秒）。"
      ]);
      if (fallbackBullets.length) return fallbackBullets.slice(0, 10);
      return ["方向2尚未生成有效要点，请回一级页点击“生成并打开找工准备计划”后重试。"];
    }

    function renderDetail() {
      const id = getTopicIdFromHash();
      const topic = topics.find((t) => t.id === id) || topics[0];
      const textbook = textbookById[topic.id] || fallbackTextbookForTopic(topic);
      const beginner = beginnerById[topic.id] || fallbackBeginnerForTopic(topic);
      const moduleKey = resolveMergedModuleKey(topic);
      const industrySections = buildIndustrySections(topic);
      const isIndustry = moduleKey === "technical";
      const useFlatForEBC = ["experience", "behavioral", "case"].includes(moduleKey);
      const flatKnowledge = Array.isArray(topic.knowledge) && topic.knowledge.length
        ? topic.knowledge
        : [`${topic.title}：暂无可展示要点，请回一级页补充该方向输入。`];
      const flatAction = Array.isArray(topic.action) && topic.action.length
        ? topic.action
        : ["建议补充可量化经历后再生成。"];
      const flatInterview = String(topic.interview || "").trim();
      const flatTopicHtml = `
        <div class="textbook-block">
          <div class="industry-tip">提示：每学会一个知识点请打勾，便于计算学习进度</div>
          <div class="textbook-section">
            <h4>重点阐述内容（Bullet Points）</h4>
            ${renderInteractiveRows(flatKnowledge, topic.id, "focus_points")}
          </div>
          <div class="textbook-section">
            <h4>表达与演练建议</h4>
            ${renderInteractiveRows(flatAction, topic.id, "delivery_actions")}
          </div>
          ${flatInterview ? `
            <div class="script-box">
              <strong>口述主线（60-90秒）：</strong>${escapeHtml(flatInterview)}
            </div>
          ` : ""}
        </div>
      `;
      let experienceTopicHtml = "";
      if (moduleKey === "experience") {
        const d2Bullets = buildDirection2BulletPoints(topic);
        const resumeParseStats = summarizeResumeParseStats(currentLevel1Payload || {});
        const onlyMismatch = d2Bullets.length === 1 && d2Bullets[0] === "该岗位与你的既有经历偏差过大，暂无相关建议";
        experienceTopicHtml = `
          <div class="textbook-block">
            <div class="experience-top-stack">
              <div class="experience-top-module">简历解析状态：已上传${resumeParseStats.total}份，成功解析${resumeParseStats.success}份，失败${resumeParseStats.failed}份${resumeParseStats.unsupported ? `，不支持${resumeParseStats.unsupported}份` : ""}</div>
              <div class="experience-top-module">提示：每学会一个知识点请打勾，便于计算学习进度</div>
            </div>
            <div class="textbook-section">
              <h4>相关经历深挖</h4>
              ${onlyMismatch
                ? `<div class="hint">${escapeHtml(d2Bullets[0])}</div>`
                : renderInteractiveRows(d2Bullets, topic.id, "experience_bullets")}
            </div>
          </div>
        `;
      }
      const buildingModuleHtml = `
        <div class="textbook-block">
          <div class="module-building-placeholder">该模块内容受时间限制仍在搭建中，目前仅显示若干个标准化的案例模拟，后续将新增基于用户上传JD的个性化案例模拟生成功能。</div>
        </div>
      `;
      const caseQuestions = (Array.isArray(dynamicCaseQuestions) && dynamicCaseQuestions.length >= 5)
        ? dynamicCaseQuestions.slice(0, 5)
        : fallbackCaseQuestionsFromKeywords(currentLevel1Payload || {});
      const caseModuleHtml = `
        <div class="textbook-block">
          <div class="textbook-section">
            <div class="case-section-header">
              <h4>典型情景案例模拟（建议逐题演练）</h4>
              <button class="btn refresh-case-btn" data-role="refresh-case-questions">刷新模拟题</button>
            </div>
            ${renderInteractiveRows(caseQuestions, topic.id, "case_questions")}
          </div>
        </div>
      `;
      const behavioralQuestions = getBehavioralQuestions();
      const behavioralModuleHtml = `
        <div class="textbook-block">
          <div class="module-building-placeholder">该模块内容受时间限制仍在搭建中，目前仅显示若干条标准化的行为面试题，后续将新增基于用户上传JD的个性化行为面试题生成功能。</div>
          <div class="textbook-section">
            <h4>典型行为面试题（建议逐条准备）</h4>
            ${renderInteractiveRows(behavioralQuestions, topic.id, "behavioral_questions")}
          </div>
        </div>
      `;
      const textbookHtml = textbook ? `
        <div class="textbook-block">
          <h3>课本内容（展开学习）</h3>
          <div class="textbook-section">
            <h4>0) 小白概念入门（先读这个）</h4>
            ${renderInteractiveRows(beginner, topic.id, "beginner")}
          </div>
          <div class="textbook-section">
            <h4>1) 核心认知</h4>
            ${renderInteractiveRows(textbook.core, topic.id, "core")}
          </div>
          <div class="textbook-section">
            <h4>2) 实操框架</h4>
            ${renderInteractiveRows(textbook.framework, topic.id, "framework")}
            <div class="formula">${textbook.formula}</div>
          </div>
          <div class="textbook-section">
            <h4>3) 场景示例</h4>
            ${renderInteractiveRows(textbook.caseDemo, topic.id, "caseDemo")}
          </div>
          <div class="textbook-section">
            <h4>4) 常见误区</h4>
            ${renderInteractiveRows(textbook.pitfalls, topic.id, "pitfalls")}
          </div>
          <div class="script-box">
            <strong>可直接背诵话术：</strong>${textbook.script}
          </div>
        </div>
      ` : "";
      const industryProfile = detectIndustryProfile(topic);
      const industryDict = topic?.aiIndustry?.dictionary && typeof topic.aiIndustry.dictionary === "object"
        ? topic.aiIndustry.dictionary
        : null;
      const industryName = String(
        industryDict?.industry
        || topic?.aiIndustry?.industryName
        || industryProfile.name
        || ""
      ).trim();
      const keywordList = Array.isArray(industryDict?.keywords) && industryDict.keywords.length
        ? industryDict.keywords
        : Array.isArray(topic?.aiIndustry?.keywords) && topic.aiIndustry.keywords.length
          ? topic.aiIndustry.keywords
          : industryProfile.jdClues.slice(0, 3);
      const industryHtml = `
        <div class="textbook-block">
          ${industryName || keywordList.length ? `<div class="industry-tags">${industryName ? `<div class="industry-tag-line"><strong>行业判断：</strong>${escapeHtml(industryName)}</div>` : ""}${keywordList.length ? `<div class="industry-tag-line"><strong>关键词：</strong>${escapeHtml(keywordList.join("、"))}</div>` : ""}</div>` : ""}
          <div class="industry-tip">提示：每学会一个知识点请打勾，便于计算学习进度</div>
          ${industrySections.map((block) => `
            <div class="industry-block">
              <h4>${block.title}</h4>
              ${renderInteractiveRows(block.items, topic.id, block.sectionKey)}
            </div>
          `).join("")}
        </div>
      `;
      topicDetailEl.className = `card topic-content`;
      topicDetailEl.innerHTML = `
        ${isIndustry ? industryHtml : (moduleKey === "experience" ? experienceTopicHtml : (moduleKey === "behavioral" ? behavioralModuleHtml : (moduleKey === "case" ? caseModuleHtml : (useFlatForEBC ? flatTopicHtml : textbookHtml))))}
      `;
      const refreshCaseInCardBtn = topicDetailEl.querySelector('[data-role="refresh-case-questions"]');
      if (refreshCaseInCardBtn) {
        refreshCaseInCardBtn.addEventListener("click", async () => {
          refreshCaseInCardBtn.disabled = true;
          try {
            archiveAndClearQaRecords(topic.id, ["case_questions"]);
            await refreshCaseQuestionsAndRender(true);
          } finally {
            refreshCaseInCardBtn.disabled = false;
          }
        });
      }
      bindTrackItemHandlers();
      bindQaHandlers(topic.id);
    }

    function bindTrackItemHandlers() {
      const boxes = topicDetailEl.querySelectorAll('[data-role="track-item"]');
      boxes.forEach((box) => {
        box.addEventListener("change", () => {
          const key = box.getAttribute("data-key");
          const list = loadChecklist();
          list[key] = box.checked;
          saveChecklist(list);
          renderSidebar();
          renderDetail();
          renderProgress();
        });
      });
      const bulletBoxes = topicDetailEl.querySelectorAll('[data-role="bullet-point"]');
      bulletBoxes.forEach((box) => {
        box.addEventListener("change", () => {
          const key = box.getAttribute("data-key");
          const list = loadChecklist();
          list[key] = box.checked;
          saveChecklist(list);
          renderSidebar();
          renderDetail();
          renderProgress();
        });
      });
    }

    function bindQaHandlers(topicId) {
      const askButtons = topicDetailEl.querySelectorAll('[data-role="qa-ask"]');
      askButtons.forEach((btn) => {
        btn.addEventListener("click", async () => {
          const key = btn.getAttribute("data-key");
          const context = btn.getAttribute("data-context") || "";
          const inputEl = topicDetailEl.querySelector(`[data-role="qa-input"][data-key="${key}"]`);
          const answerEl = topicDetailEl.querySelector(`[data-role="qa-answer"][data-key="${key}"]`);
          const question = (inputEl?.value || "").trim();
          if (!question) {
            answerEl.textContent = "请先输入问题。";
            answerEl.classList.remove("empty");
            return;
          }
          const config = loadLlmConfig();
          if (!config.endpoint || !config.model || !config.apiKey) {
            answerEl.textContent = "请先在一级页面配置模型与API Key后再提问。";
            answerEl.classList.remove("empty");
            return;
          }
          btn.disabled = true;
          answerEl.textContent = "LLM分析中...";
          answerEl.classList.remove("empty");
          try {
            const result = await callLLM(config, question, context);
            const richFromModel = (result.keypointMarkdown || "").trim();
            const tableFromAnswer = extractTableFromText(result.answer || "");
            const rich = richFromModel || tableFromAnswer;
            const qa = loadQaStore();
            const sectionKey = btn.getAttribute("data-section") || "";
            const itemIndex = Number(btn.getAttribute("data-index") || "0");
            const current = normalizeQaRecord(qa[key], {
              topicId,
              sectionKey,
              itemIndex,
              context
            });
            current.history.push({
              question,
              answer: result.answer,
              distilledKeypoint: result.keypoint,
              distilledRich: rich,
              askedAt: new Date().toLocaleString()
            });
            qa[key] = {
              topicId: current.topicId,
              sectionKey: current.sectionKey,
              itemIndex: current.itemIndex,
              context: current.context,
              history: current.history
            };
            saveQaStore(qa);
            if (inputEl) inputEl.value = "";
            renderDetail();
            renderSidebar();
            renderProgress();
          } catch (err) {
            answerEl.textContent = `LLM调用失败：${err.message}`;
          } finally {
            btn.disabled = false;
          }
        });
      });
      const caseRefButtons = topicDetailEl.querySelectorAll('[data-role="case-ref-answer"]');
      caseRefButtons.forEach((btn) => {
        btn.addEventListener("click", async () => {
          const key = btn.getAttribute("data-key");
          const context = btn.getAttribute("data-context") || "";
          const answerEl = topicDetailEl.querySelector(`[data-role="qa-answer"][data-key="${key}"]`);
          const config = loadLlmConfig();
          if (!config.endpoint || !config.model || !config.apiKey) {
            answerEl.textContent = "请先在一级页面配置模型与API Key后再生成参考答案。";
            answerEl.classList.remove("empty");
            return;
          }
          const roleName = String(currentLevel1Payload?.roleName || "目标岗位").trim();
          const jdHints = splitToLines(String(currentLevel1Payload?.jobDescription || "")).slice(0, 6).join("；");
          const prompt = `请给出这道情景案例题的参考答案，结构为“问题定义-分析框架-行动方案-风险与验证-30秒总结”，并尽量贴合岗位：${roleName}。题目：${context}。岗位关键词：${jdHints || roleName}`;
          btn.disabled = true;
          answerEl.textContent = "正在生成参考答案...";
          answerEl.classList.remove("empty");
          try {
            const result = await callLLM(config, prompt, context);
            const richFromModel = (result.keypointMarkdown || "").trim();
            const tableFromAnswer = extractTableFromText(result.answer || "");
            const rich = richFromModel || tableFromAnswer;
            const qa = loadQaStore();
            const sectionKey = btn.getAttribute("data-section") || "";
            const itemIndex = Number(btn.getAttribute("data-index") || "0");
            const current = normalizeQaRecord(qa[key], {
              topicId,
              sectionKey,
              itemIndex,
              context
            });
            current.history.push({
              question: "查看参考答案",
              answer: result.answer,
              distilledKeypoint: result.keypoint,
              distilledRich: rich,
              askedAt: new Date().toLocaleString()
            });
            qa[key] = {
              topicId: current.topicId,
              sectionKey: current.sectionKey,
              itemIndex: current.itemIndex,
              context: current.context,
              history: current.history
            };
            saveQaStore(qa);
            renderDetail();
            renderSidebar();
            renderProgress();
          } catch (err) {
            answerEl.textContent = `参考答案生成失败：${err.message}`;
          } finally {
            btn.disabled = false;
          }
        });
      });
    }

    function renderProgress() {
      if (!progressSummaryEl) return;
      let done = 0;
      let total = 0;
      let p0Done = 0;
      let p0Total = 0;
      topics.forEach((t) => {
        const stats = topicChecklistStats(t);
        done += stats.done;
        total += stats.total;
        if (t.priority === "P0") {
          p0Done += stats.done;
          p0Total += stats.total;
        }
      });
      progressSummaryEl.textContent = `总进度（知识点+动作）：${done}/${total}；核心P0进度：${p0Done}/${p0Total}。建议先把P0条目全部勾完。`;
    }

    function renderAll() {
      renderSidebar();
      renderDetail();
      renderProgress();
    }

    applyLevel1Handoff();
    initLlmTools();
    window.addEventListener("hashchange", renderAll);
    renderAll();
    if (!Array.isArray(dynamicCaseQuestions) || dynamicCaseQuestions.length < 5) {
      refreshCaseQuestionsAndRender(false);
    }
  </script>
</body>
</html>
