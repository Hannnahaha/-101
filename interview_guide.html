<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✅ 找工计划 - 面试岗位</title>
  <style>
    :root {
      --bg: #f3f1f8;
      --card: rgba(255, 255, 255, 0.72);
      --text: #201a31;
      --sub: #5e5873;
      --border: #ded8ea;
      --primary: #6f5a96;
      --primary-soft: #ece7f7;
      --primary-deep: #4f3d73;
      --hover-soft: #f4f0fb;
      --ok: #15803d;
      --muted-bg: #f3f4f6;
      --muted-text: #9ca3af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, #f8f6fd 0%, var(--bg) 55%, #efebf7 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 136px 18px 40px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(71, 49, 102, 0.08);
    }
    h1, h2, h3 { margin: 0 0 10px; line-height: 1.35; }
    h1 { font-size: 28px; }
    h2 { font-size: 20px; }
    h3 { font-size: 16px; }
    p { margin: 8px 0; color: var(--sub); }
    ul { margin: 8px 0 0 20px; color: var(--sub); }
    li { margin: 5px 0; }
    .top-fixed-shell {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 120;
      background: transparent;
      padding: 12px 0;
    }
    .top-fixed-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 18px;
    }
    .hero {
      display: block;
      gap: 12px;
      border: 1px solid #b6a7d6;
      border-radius: 12px;
      background: rgba(243, 238, 251, 0.8);
      box-shadow: none;
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      border-radius: 999px;
      padding: 3px 9px;
      margin-right: 7px;
      margin-bottom: 6px;
      color: var(--primary);
      background: var(--primary-soft);
    }
    .date-chip {
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid #cfbfd8;
      background: #f2ecf8;
      color: var(--primary-deep);
      padding: 1px 7px;
      white-space: nowrap;
    }
    .pill {
      font-size: 11px;
      font-weight: 600;
      border-radius: 7px;
      padding: 1px 7px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .p0 { color: #7c2d12; background: #ffedd5; }
    .p1 { color: #4f3d73; background: #e8def7; }
    .p2 { color: #166534; background: #dcfce7; }
    .layout {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .sidebar {
      position: sticky;
      top: 12px;
      max-height: calc(100vh - 30px);
      overflow: auto;
    }
    .topic-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .topic-link {
      text-decoration: none;
      color: inherit;
      display: block;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
      transition: border-color 0.15s ease;
    }
    .topic-link:hover { border-color: #bda9da; background: var(--hover-soft); }
    .topic-link.active {
      border-color: #a68ccb;
      background: #f3edfb;
    }
    .meta {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
    .timeline-meta {
      margin-top: 4px;
      font-size: 12px;
      color: #5b4a79;
      font-weight: 600;
      line-height: 1.35;
    }
    .timeline-visual {
      margin-top: 6px;
      border: 1px solid #ddd2ee;
      border-radius: 8px;
      background: #faf7ff;
      padding: 8px;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
      cursor: default;
    }
    .timeline-visual:hover {
      box-shadow: 0 2px 8px rgba(109, 69, 157, 0.2);
      transform: translateY(-1px);
    }
    .timeline-chip-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .timeline-chip {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #4f3d73;
      background: #efe8fb;
      border: 1px solid #dacdf1;
      white-space: nowrap;
    }
    .timeline-task-badge {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #7c2d12;
      background: #ffedd5;
      border: 1px solid #fed7aa;
      white-space: nowrap;
    }
    .timeline-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: #ebe5f7;
    }
    .timeline-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #8b5cf6 0%, #6d28d9 100%);
      transition: width 0.25s ease;
    }
    .timeline-foot {
      margin-top: 6px;
      font-size: 11px;
      color: #6b5b8b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .timeline-foot .timeline-progress-count {
      font-weight: 700;
      color: #5b21b6;
    }
    .topic-content .url-box {
      background: #f7f4fb;
      border: 1px dashed #d5cde6;
      color: #374151;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .track-list {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
    }
    .track-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px 10px;
      margin: 7px 0;
      background: #fff;
    }
    .track-item input[type="checkbox"] {
      margin-top: 2px;
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
    }
    .track-item.done {
      background: var(--muted-bg);
      color: var(--muted-text);
      border-color: #e5e7eb;
    }
    .track-item.done .track-text {
      text-decoration: line-through;
    }
    .textbook-block {
      margin-top: 12px;
      border-top: 1px solid #e5e7eb;
      padding-top: 12px;
    }
    .textbook-section {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ebe3f4;
      background: #fcfaff;
      border-radius: 8px;
    }
    .textbook-section h4 {
      margin: 0 0 6px;
      font-size: 14px;
      color: var(--primary-deep);
    }
    .case-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .case-section-header h4 {
      margin: 0;
    }
    .refresh-case-btn {
      font-size: 18px;
      font-weight: 800;
      padding: 12px 20px;
      min-height: 48px;
      border: 1px solid #4c1d95;
      background: #5b21b6;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(91, 33, 182, 0.35);
      white-space: nowrap;
    }
    .refresh-case-btn:hover {
      background: #4c1d95;
      transform: translateY(-1px);
    }
    .refresh-case-btn:active {
      background: #3b136f;
      transform: translateY(0);
    }
    .formula {
      background: #f8f5fc;
      border: 1px dashed #d5cde6;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      color: #374151;
      margin: 6px 0;
    }
    .script-box {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      color: #065f46;
      margin-top: 8px;
    }
    .module-building-placeholder {
      margin-top: 10px;
      border: 1px solid #d1d5db;
      background: #f3f4f6;
      color: #6b7280;
      border-radius: 10px;
      padding: 24px 16px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.6;
    }
    .experience-overlap-line {
      margin-top: 8px;
      margin-bottom: 8px;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1e3a8a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
    }
    .experience-top-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }
    .experience-top-module {
      border: 1px solid #d9cdea;
      background: #f3edfb;
      color: #4f3d73;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
    }
    .experience-top-module strong {
      font-size: 12px;
      color: #5b4a79;
    }
    .experience-top-list {
      margin: 4px 0 0 16px;
      padding: 0;
    }
    .experience-top-list li {
      margin: 2px 0;
      color: #4f3d73;
    }
    .stats {
      margin-top: 8px;
      font-size: 13px;
      color: #374151;
      padding: 8px 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }
    .hero-title-wrap {
      flex: 1;
      min-width: 0;
    }
    .hero-sub {
      margin: 6px 0 0;
      font-size: 13px;
      color: #334155;
    }
    .hero-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .export-warning {
      margin-top: 6px;
      font-size: 12px;
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 6px;
      padding: 5px 8px;
      display: inline-block;
    }
    .hero-actions-text {
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      white-space: nowrap;
    }
    .step-title {
      font-size: 12px;
      color: #374151;
      margin: 6px 0 6px;
      font-weight: 600;
    }
    .selected-model {
      margin-top: 6px;
      font-size: 12px;
      color: #1e3a8a;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 6px 8px;
    }
    .llm-config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .llm-config label {
      font-size: 12px;
      color: #4b5563;
      display: block;
      margin-bottom: 4px;
    }
    .llm-config input {
      width: 100%;
      font-size: 12px;
      padding: 7px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
    }
    .llm-config input[readonly] {
      background: #f3f4f6;
      color: #6b7280;
    }
    .llm-config .full { grid-column: 1 / -1; }
    .llm-config-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .floating-export {
      padding: 0;
      background: transparent;
      display: flex;
      flex-direction: row;
      gap: 8px;
    }
    .export-panel-title {
      display: none;
    }
    .export-actions {
      display: flex;
      flex-direction: row;
      gap: 8px;
    }
    .export-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .export-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }
    .export-icon.word { color: #185abd; }
    .export-icon.excel { color: #107c41; }
    .export-btn {
      color: #fff !important;
      font-size: 14px;
      font-weight: 800;
      padding: 11px 18px;
      border-width: 2px;
      box-shadow: 0 6px 16px rgba(70, 52, 95, 0.25);
      border-radius: 12px;
      letter-spacing: 0.2px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .word-btn {
      background: #2f6fdb !important;
      border-color: #2f6fdb !important;
    }
    .excel-btn {
      background: #2e8b57 !important;
      border-color: #2e8b57 !important;
    }
    .export-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(70, 52, 95, 0.34);
    }
    .preset-row {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .preset-btn {
      font-size: 12px;
      border: 1px solid #d9d0e8;
      background: #ffffff;
      color: #374151;
      border-radius: 6px;
      padding: 5px 9px;
      cursor: pointer;
    }
    .preset-btn:hover {
      border-color: #bba6d7;
      color: var(--primary-deep);
      background: #f2ecf8;
    }
    .preset-btn.active {
      border-color: #a88ecb;
      background: #e8def7;
      color: var(--primary-deep);
      font-weight: 600;
    }
    .advanced-config {
      margin-top: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 6px 8px;
      background: #fcfcfd;
    }
    .advanced-config summary {
      cursor: pointer;
      color: #4b5563;
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }
    .preset-note {
      margin-top: 6px;
      font-size: 12px;
      color: #6b7280;
    }
    .btn {
      font-size: 12px;
      border: 1px solid #cfbfd8;
      background: #f2ecf8;
      color: var(--primary-deep);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    .llm-status {
      font-size: 12px;
      color: #6b7280;
    }
    .knowledge-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 10px;
      margin: 8px 0;
      padding: 8px;
      border: 1px solid #eef2f7;
      border-radius: 8px;
      background: #ffffff;
    }
    .knowledge-main {
      font-size: 14px;
      color: #334155;
    }
    .knowledge-main ul {
      margin: 0;
      padding-left: 18px;
    }
    .knowledge-main li {
      margin: 0;
    }
    .knowledge-extra {
      margin-top: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      background: #ecfeff;
      border: 1px solid #bae6fd;
      color: #0c4a6e;
      font-size: 12px;
    }
    .knowledge-extra .extra-title {
      font-weight: 600;
      margin-bottom: 6px;
    }
    .knowledge-extra table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      background: #fff;
      color: #0f172a;
    }
    .knowledge-extra th,
    .knowledge-extra td {
      border: 1px solid #cbd5e1;
      padding: 4px 6px;
      text-align: left;
      vertical-align: top;
      font-size: 12px;
    }
    .knowledge-extra th {
      background: #eff6ff;
      font-weight: 600;
    }
    .knowledge-extra ul {
      margin: 6px 0 0 18px;
      color: #0c4a6e;
    }
    .knowledge-chat {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px;
    }
    .knowledge-chat textarea {
      width: 100%;
      min-height: 62px;
      font-size: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 6px;
      resize: vertical;
      background: #fff;
    }
    .knowledge-chat .chat-actions {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }
    .knowledge-chat .answer {
      margin-top: 6px;
      font-size: 12px;
      color: #1f2937;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 6px;
      white-space: pre-wrap;
      max-height: 200px;
      overflow: auto;
    }
    .knowledge-chat .answer.empty {
      color: #9ca3af;
    }
    .qa-history {
      margin-top: 8px;
      border-top: 1px dashed #d1d5db;
      padding-top: 8px;
    }
    .qa-history-title {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .qa-history-item {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 6px;
      font-size: 12px;
      color: #1f2937;
    }
    .qa-history-q {
      margin-bottom: 4px;
      color: #1e3a8a;
    }
    .qa-history-a {
      white-space: pre-wrap;
      margin-bottom: 4px;
      color: #111827;
    }
    .qa-history-k {
      border-top: 1px dashed #e5e7eb;
      margin-top: 4px;
      padding-top: 4px;
      color: #0c4a6e;
    }
    .qa-history-time {
      margin-top: 4px;
      color: #6b7280;
      font-size: 11px;
    }
    .industry-block {
      margin-top: 10px;
      border: 1px solid #d9cdea;
      border-radius: 8px;
      background: #f7f3fc;
      padding: 8px;
    }
    .industry-block h4 {
      margin: 0 0 6px;
      font-size: 14px;
      color: var(--primary-deep);
    }
    .industry-tags {
      margin-top: 6px;
      font-size: 14px;
      line-height: 1.6;
      color: #334155;
      background: #f2ecf8;
      border: 1px solid #cfbfd8;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .industry-tag-line + .industry-tag-line {
      margin-top: 2px;
    }
    .industry-tip {
      margin: 8px 0 4px;
      border: 1px solid #cdbfe3;
      border-radius: 8px;
      background: #efe8f8;
      color: #4b3f63;
      padding: 6px 10px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
    }
    .knowledge-bullet {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .knowledge-bullet-check {
      margin-top: 2px;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .knowledge-bullet-text {
      flex: 1 1 auto;
    }
    .knowledge-bullet-main {
      color: inherit;
    }
    .ai-reason-line {
      margin-top: 4px;
      font-size: 12px;
      color: #1e3a8a;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 3px 6px;
      display: inline-block;
    }
    .knowledge-bullet.done .knowledge-bullet-text {
      color: #9f97b4;
      text-decoration: line-through;
    }
    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #6b7280;
    }
    .hidden { display: none !important; }
    .imported-summary {
      margin-top: 10px;
      font-size: 13px;
      color: #374151;
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      border-radius: 8px;
      padding: 10px;
      white-space: pre-wrap;
    }
    @media (max-width: 980px) {
      .hero {
        gap: 8px;
      }
      .wrap { padding-top: 154px; }
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; max-height: none; }
      .knowledge-row { grid-template-columns: 1fr; }
      .llm-config-grid { grid-template-columns: 1fr; }
      .hero-actions-text {
        font-size: 13px;
      }
      .floating-export {
        width: auto;
      }
      .export-actions {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="top-fixed-shell">
    <div class="top-fixed-inner">
      <section class="card hero">
      <div class="hero-title-wrap">
        <h1 id="heroTitle">面试补强路线（前3天高优先级压缩）</h1>
      </div>
      <div class="hero-actions">
        <span class="hero-actions-text">导出AI对话学习笔记</span>
        <div class="floating-export">
          <div class="export-panel-title">导出AI对话学习笔记</div>
          <div class="export-actions">
            <button id="exportWordBtn" class="btn export-btn word-btn"><span class="export-label"><span class="export-icon word">W</span>Word格式</span></button>
            <button id="exportExcelBtn" class="btn export-btn excel-btn"><span class="export-label"><span class="export-icon excel">X</span>Excel格式</span></button>
          </div>

    function extractContextFromJD(payload, focus) {
      const jdText = String(payload?.jobDescription || "");
      const lines = splitToLines(jdText);
      if (!lines.length) return [];
      const tokens = tokenizeFocus(focus);
      const behaviorMode = /(behavior|behaviour|行为|软技能|沟通|抗压|领导力|协作|动机)/i.test(focus);
      const behaviorRegex = /(behavior|behaviour|行为|沟通|抗压|领导力|协作|动机|价值观|冲突|复盘|表达)/i;

      const scored = lines.map((line) => {
        const lower = line.toLowerCase();
        let score = 0;
        tokens.forEach((t) => {
          if (lower.includes(t)) score += 2;
        });
        if (behaviorMode && behaviorRegex.test(line)) score += 2;
        if (/负责|需要|能力|经验|优先|熟悉|理解|分析|推动/.test(line)) score += 1;
        return { line, score };
      });
      return scored
        .filter((x) => x.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 4)
        .map((x) => x.line);
    }

      if (!match) return null;
      const y = Number(match[1]);
      const m = Number(match[2]) - 1;
      const d = Number(match[3]);
      return new Date(y, m, d);

    function computePrepDays(targetDate) {
      const target = parseDateLocal(targetDate);
      if (!target || Number.isNaN(target.getTime())) return 5;
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffMs = target.getTime() - today.getTime();
      const diffDays = Math.ceil(diffMs / 86400000);
      return Math.max(1, diffDays);
    }

      return labels[Math.min(labels.length - 1, Math.max(0, bucket))];

        if (!focusKey) return;

    function inferFocusCategory(focus) {
      const text = String(focus || "");
      if (/(behavior|behaviour|行为|软技能|求职动机|抗压|领导力|协作|冲突)/i.test(text)) return "behavioral";
      if (/(crm|会员|私域|生命周期|留存|分层运营|触达)/i.test(text)) return "crm";
      if (/(technical|技术|算法|数据|架构|系统|模型|sql|python|统计|实验)/i.test(text)) return "technical";
      if (/(经历|项目|star|简历|深挖|复盘)/i.test(text)) return "experience";
      if (/(case|情景|案例|估算|市场进入|策略模拟|商业分析题)/i.test(text)) return "case";
      return "general";
    }

    function buildTopicsFromHandoff(payload) {
      const structuredList = Array.isArray(payload.prepFocusItemsFinal) && payload.prepFocusItemsFinal.length
        ? payload.prepFocusItemsFinal
            .map((x, idx) => ({
              focus: String(x?.focus || "").trim(),
              moduleKey: String(x?.moduleKey || "").trim(),
              moduleTitle: String(x?.moduleTitle || "").trim(),
              idx
            }))
            .filter((x) => x.focus)
        : [];
      const fallbackList = Array.isArray(payload.prepFocusListFinal) && payload.prepFocusListFinal.length
        ? payload.prepFocusListFinal.filter(Boolean).map((focus, idx) => ({ focus, moduleKey: "", moduleTitle: "", idx }))
        : (Array.isArray(payload.prepFocusList) ? payload.prepFocusList.filter(Boolean).map((focus, idx) => ({ focus, moduleKey: "", moduleTitle: "", idx })) : []);
      const list = structuredList.length ? structuredList : fallbackList;
      if (!list.length) return [];
      const prepDays = computePrepDays(payload?.targetDate);
      const countdownLabels = buildCountdownLabels(prepDays);
      const materialNames = collectMaterialNames(payload);
      const aiBlueprintMap = buildAiBlueprintMap(payload);
      const prepared = list.map((item) => {
        const focus = item.focus;
        const jdHints = extractContextFromJD(payload, focus);
        const category = item.moduleKey || inferFocusCategory(focus);
        const focusKey = normalizeFocusKey(focus);
        const aiBlueprint = aiBlueprintMap.get(`${item.moduleKey}::${focusKey}`) || aiBlueprintMap.get(focusKey) || null;
        return { focus, idx: item.idx, jdHints, category, aiBlueprint, moduleKey: item.moduleKey, moduleTitle: item.moduleTitle };
      }).sort((a, b) => {
        const moduleScoreA = moduleOrderScore(a.moduleKey);
        const moduleScoreB = moduleOrderScore(b.moduleKey);
        if (moduleScoreA !== moduleScoreB) return moduleScoreA - moduleScoreB;
        const scoreA = categoryOrderScore(a.category);
        const scoreB = categoryOrderScore(b.category);
        if (scoreA !== scoreB) return scoreA - scoreB;
        return a.idx - b.idx;
      });
      const normalizeToModule = (item) => {
        const mk = String(item.moduleKey || "").trim();
        if (["technical", "experience", "behavioral", "case"].includes(mk)) return mk;
        if (item.category === "experience") return "experience";
        if (item.category === "behavioral") return "behavioral";
        if (item.category === "case") return "case";
        return "technical";
      };
      const unique = (arr) => {
        const out = [];
        (arr || []).forEach((x) => {
          const text = String(x || "").trim();
          if (!text) return;
          if (out.includes(text)) return;
          out.push(text);
        });
        return out;
      };
      const enriched = prepared.map((item) => {
        const fallback = buildTopicByCategory(item.category, item.focus, item.jdHints, materialNames);
        const generated = item.aiBlueprint
          ? {
              knowledge: Array.isArray(item.aiBlueprint.knowledge) && item.aiBlueprint.knowledge.length
                ? item.aiBlueprint.knowledge
                : fallback.knowledge,
              action: Array.isArray(item.aiBlueprint.action) && item.aiBlueprint.action.length
                ? item.aiBlueprint.action
                : fallback.action,
              interview: String(item.aiBlueprint.interview || "").trim() || fallback.interview
            }
          : fallback;
        return { ...item, normalizedModule: normalizeToModule(item), generated };
      });

      const moduleDefs = [
        { key: "technical", title: "方向1：行业核心知识扫盲" },
        { key: "case", title: "方向2：情景化案例模拟" },
        { key: "experience", title: "方向3：既有经历深挖" },
        { key: "behavioral", title: "方向4：行为面试" }
      ];

      return moduleDefs.map((def, idx) => {
        const items = enriched.filter((x) => x.normalizedModule === def.key);
        const sourceHints = unique(items.flatMap((x) => x.jdHints || [])).slice(0, 20);
        const focusLines = unique(items.map((x) => x.focus)).slice(0, 6);
        const knowledge = unique(items.flatMap((x) => x.generated?.knowledge || []));
        const action = unique(items.flatMap((x) => x.generated?.action || []));
        const interview = unique(items.map((x) => x.generated?.interview || "")).join("；");
        const aiBeginner = unique(items.flatMap((x) => Array.isArray(x.aiBlueprint?.beginner) ? x.aiBlueprint.beginner : []));
        const textbookCore = unique(items.flatMap((x) => x.aiBlueprint?.textbook?.core || []));
        const textbookFramework = unique(items.flatMap((x) => x.aiBlueprint?.textbook?.framework || []));
        const textbookCase = unique(items.flatMap((x) => x.aiBlueprint?.textbook?.caseDemo || []));
        const textbookPitfalls = unique(items.flatMap((x) => x.aiBlueprint?.textbook?.pitfalls || []));
        const textbookFormula = unique(items.map((x) => x.aiBlueprint?.textbook?.formula || "")).join("；");
        const textbookScript = unique(items.map((x) => x.aiBlueprint?.textbook?.script || "")).join("；");
        const aiTextbook = (textbookCore.length || textbookFramework.length || textbookCase.length || textbookPitfalls.length || textbookFormula || textbookScript)
          ? {
              core: textbookCore,
              framework: textbookFramework,
              formula: textbookFormula,
              caseDemo: textbookCase,
              pitfalls: textbookPitfalls,
              script: textbookScript
            }
          : null;
        const aiIndustry = def.key === "technical"
          ? (items.find((x) => x.aiBlueprint?.aiIndustry)?.aiBlueprint?.aiIndustry || null)
          : null;
        return {
          id: `topic-merged-${def.key}`,
          title: def.title,
          priority: priorityByIndex(idx),
          day: dayByIndex(idx, moduleDefs.length, countdownLabels),
          why: focusLines.length ? `聚合方向：${focusLines.join(" / ")}` : "该方向来自一级页面输入，已聚合展示。",
          knowledge,
          action,
          interview: interview || "",
          category: def.key,
          moduleKey: def.key,
          sourceHints,
          aiBeginner,
          aiTextbook,
          aiIndustry
        };
      }).filter((t) => t.knowledge.length || t.action.length || t.aiBeginner.length || t.aiTextbook || t.aiIndustry);
    }

    function attachScheduleMetadata(activeTopics, payload) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const target = parseDateLocal(payload?.targetDate) || addDays(today, Math.max(7, activeTopics.length));
      const targetDate = target.getTime() < today.getTime() ? today : target;
      const remainingDays = Math.max(1, Math.ceil((targetDate.getTime() - today.getTime()) / 86400000));
      const checklist = loadChecklist();

      const orderedTasks = [...activeTopics].map((t, idx) => ({
        ...t,
        _moduleKey: normalizeModuleKey(t),
        _originIdx: idx,
        _taskStats: computeTopicTaskStats(t, checklist)
      })).sort((a, b) => {
        const sa = moduleOrderScore(a._moduleKey);
        const sb = moduleOrderScore(b._moduleKey);
        if (sa !== sb) return sa - sb;
        return a._originIdx - b._originIdx;
      });

      const weights = orderedTasks.map((t) => Math.max(0, Number(t?._taskStats?.pending || 0)));
      const totalWeight = weights.reduce((sum, x) => sum + x, 0);
      const fallbackWeights = orderedTasks.map((t) => Math.max(1, Number(t?._taskStats?.total || 1)));
      const effectiveWeights = totalWeight > 0 ? weights : fallbackWeights;
      const effectiveTotal = effectiveWeights.reduce((sum, x) => sum + x, 0) || orderedTasks.length;
      const rawAlloc = effectiveWeights.map((w) => (w / effectiveTotal) * remainingDays);
      const dayAlloc = rawAlloc.map((x) => Math.floor(x));
      let allocated = dayAlloc.reduce((sum, x) => sum + x, 0);
      if (allocated < remainingDays) {
        const remainders = rawAlloc.map((x, idx) => ({ idx, r: x - Math.floor(x) }))
          .sort((a, b) => b.r - a.r);
        let ptr = 0;
        while (allocated < remainingDays && remainders.length) {
          const pick = remainders[ptr % remainders.length];
          dayAlloc[pick.idx] += 1;
          allocated += 1;
          ptr += 1;
        }
      }
      if (allocated > remainingDays) {
        for (let i = dayAlloc.length - 1; i >= 0 && allocated > remainingDays; i -= 1) {
          if (dayAlloc[i] > 0) {
            dayAlloc[i] -= 1;
            allocated -= 1;
          }
        }
      }

      let cursor = 0;
      orderedTasks.forEach((t, idx) => {
        const span = Math.max(0, dayAlloc[idx] || 0);
        const startDate = addDays(today, cursor);
        const endDate = span > 0 ? addDays(today, cursor + span - 1) : startDate;
        t._timelineStartDate = startDate;
        t._timelineEndDate = endDate;
        t._timelinePending = Math.max(0, Number(t?._taskStats?.pending || 0));
        t._scheduledDate = startDate;
        cursor += span;
      });
      const scheduleById = new Map(orderedTasks.map((t) => [t.id, {
        scheduledDate: t._scheduledDate,
        moduleKey: t._moduleKey,
        timelineStartDate: t._timelineStartDate,
        timelineEndDate: t._timelineEndDate,
        timelinePending: t._timelinePending
      }]));
      return activeTopics.map((topic) => {
        const scheduled = scheduleById.get(topic.id);
        return {
          ...topic,
          _scheduledDate: scheduled?.scheduledDate || null,
          _moduleKey: scheduled?.moduleKey || normalizeModuleKey(topic),
          _timelineStartDate: scheduled?.timelineStartDate || null,
          _timelineEndDate: scheduled?.timelineEndDate || null,
          _timelinePending: Number(scheduled?.timelinePending || 0)
        };
      });
    }

    function loadChecklist() {
      const key = getChecklistStoreKey();
      try {
        return JSON.parse(localStorage.getItem(key) || "{}");
      } catch (e) {
        return {};
      }
    }

    function saveChecklist(data) {
      localStorage.setItem(getChecklistStoreKey(), JSON.stringify(data));
    }

    function checklistKey(topicId, listType, idx) {
      return `${topicId}::${listType}::${idx}`;
    }

    function topicChecklistStats(topic) {
      const list = loadChecklist();
      const total = (topic.knowledge?.length || 0) + (topic.action?.length || 0);
      let done = 0;
      (topic.knowledge || []).forEach((_, i) => {
        if (list[checklistKey(topic.id, "knowledge", i)]) done += 1;
      });
      (topic.action || []).forEach((_, i) => {
        if (list[checklistKey(topic.id, "action", i)]) done += 1;
      });
      return { done, total, complete: total > 0 && done === total };
    }

    function normalizeLlmConfig(next) {
      if (!next || typeof next !== "object") return {};
      let endpoint = String(next.endpoint || "").trim();
      const model = String(next.model || "").trim();
      const apiKey = String(next.apiKey || "").trim();
      if (!endpoint) return { ...next, endpoint, model, apiKey };
      const lower = endpoint.toLowerCase();
      if (
        lower.startsWith("http://")
        && /api\.deepseek\.com|api\.openai\.com|openrouter\.ai|generativelanguage\.googleapis\.com|ark\.cn-beijing\.volces\.com/.test(lower)
      ) {
        endpoint = `https://${endpoint.slice("http://".length)}`;
      }
      return { ...next, endpoint, model, apiKey };
    }

    function loadLlmConfig() {
      try {
        return normalizeLlmConfig(JSON.parse(localStorage.getItem(llmConfigStoreKey) || "{}"));
      } catch (e) {
        return {};
      }
    }

    function qaKey(topicId, sectionKey, idx) {
      return `${topicId}::${sectionKey}::${idx}`;
    }

    function parseQaKey(key) {
      const [topicId = "", sectionKey = "", idxStr = "0"] = String(key || "").split("::");
      const idxNum = Number(idxStr);
      return {
        topicId,
        sectionKey,
        itemIndex: Number.isFinite(idxNum) ? idxNum : 0
      };
    }

    function normalizeQaHistoryItem(item) {
      if (!item || typeof item !== "object") return null;
      const question = String(item.question || "").trim();
      const answer = String(item.answer || item.lastAnswer || "").trim();
      const distilledKeypoint = String(item.distilledKeypoint || item.keypoint || "").trim();
      const distilledRich = String(item.distilledRich || item.keypointMarkdown || "").trim();
      const askedAt = String(item.askedAt || item.createdAt || "").trim();
      if (!question && !answer && !distilledKeypoint && !distilledRich) return null;
      return { question, answer, distilledKeypoint, distilledRich, askedAt };
    }

    function normalizeQaRecord(record, fallbackMeta = {}) {
      const base = record && typeof record === "object" ? record : {};
      const mergedMeta = {
        topicId: String(base.topicId || fallbackMeta.topicId || "").trim(),
        sectionKey: String(base.sectionKey || fallbackMeta.sectionKey || "").trim(),
        itemIndex: Number.isFinite(Number(base.itemIndex)) ? Number(base.itemIndex) : Number(fallbackMeta.itemIndex || 0),
        context: String(base.context || fallbackMeta.context || "").trim()
      };
      const history = [];
      if (Array.isArray(base.history)) {
        base.history.forEach((item) => {
          const normalized = normalizeQaHistoryItem(item);
          if (normalized) history.push(normalized);
        });
      }
      if (!history.length) {
        const legacy = normalizeQaHistoryItem({
          question: base.question,
          answer: base.lastAnswer,
          distilledKeypoint: base.distilledKeypoint,
          distilledRich: base.distilledRich,
          askedAt: base.askedAt
        });
        if (legacy) history.push(legacy);
      }
      return { ...mergedMeta, history };
    }

    function pickJdClues(payload, matchRegex) {
      const jdText = String(payload?.jobDescription || "");
      if (!jdText) return [];
      const lines = splitToLines(jdText);
      if (!lines.length) return [];
      if (!matchRegex || typeof matchRegex.test !== "function") {
        return lines

    function simpleHash(text) {
      const str = String(text || "");
      let h = 2166136261;
      for (let i = 0; i < str.length; i += 1) {
        h ^= str.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      }
      return (h >>> 0).toString(36);
    }

    function archiveAndClearQaRecords(topicId, sectionKeys) {
      const targetSections = Array.isArray(sectionKeys) ? sectionKeys.map((x) => String(x || "").trim()) : [];
      if (!topicId || !targetSections.length) return 0;
      const qa = loadQaStore();
      const archive = loadQaArchiveStore();
      const keys = Object.keys(qa).filter((k) => {
        const parsed = parseQaKey(k);
        return parsed.topicId === topicId && targetSections.includes(parsed.sectionKey);
      });
      if (!keys.length) return 0;
      const archivedAt = new Date().toLocaleString();
      keys.forEach((k) => {
        const parsed = parseQaKey(k);
        const record = normalizeQaRecord(qa[k], parsed);
        if (record.history.length) {
          archive.push({
            archivedAt,
            topicId: record.topicId,
            sectionKey: record.sectionKey,
            itemIndex: record.itemIndex,
            context: record.context,
            history: record.history
          });
        }
        delete qa[k];
      });
      saveQaStore(qa);
      saveQaArchiveStore(archive);
      return keys.length;
    }

          response_format: { type: "json_object" },
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: userPrompt }
          ]
        })
      }, 45000);
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      const raw = await res.text();
      const data = JSON.parse(raw);
      const content = data?.choices?.[0]?.message?.content || "";
      const contentText = String(content || "").trim();
      let parsed = {};
      try {
        parsed = JSON.parse(contentText || "{}");
      } catch (_) {
        const match = contentText.match(/\{[\s\S]*\}/);
        parsed = match ? JSON.parse(match[0]) : {};
      }
      const list = Array.isArray(parsed?.questions) ? parsed.questions : [];
      const cleaned = list.map((x) => String(x || "").trim()).filter(Boolean).slice(0, 5);
      if (cleaned.length < 5) {
        return fallbackCaseQuestionsFromKeywords(payload);
      }
      return cleaned;
    }

    async function callLLM(config, userQuestion, contextText) {
      const cfg = normalizeLlmConfig(config);
      const systemPrompt = [
        "你是供应链与物流学习助教。",
        "请根据学习者的问题和给定知识点上下文回答。",
        "必须返回严格JSON格式：{\"answer\":\"...\",\"keypoint\":\"...\",\"keypoint_markdown\":\"...\"}",
        "answer用于详细解释；keypoint用于提炼并回写为一句核心知识点。",
        "keypoint_markdown用于提炼并回写可结构化内容（可包含markdown表格/列表）。",
        "keypoint长度控制在40字内。"
      ].join("\n");
      const body = {
        model: cfg.model,
        temperature: 0.2,
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: `知识点上下文：${contextText}\n学习者问题：${userQuestion}` }
        ],
        response_format: { type: "json_object" }
      };

      const fetchWithTimeout = async (url, options, timeoutMs) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          return await fetch(url, { ...options, signal: controller.signal });
        } finally {
          clearTimeout(timer);
        }
      };
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const parseJsonLoose = (rawText) => {
        const text = String(rawText || "").trim();
        if (!text) throw new Error("响应体为空");
        try {
          return JSON.parse(text);
        } catch (_) {}
        const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
        if (fence && fence[1]) {
          try {
            return JSON.parse(fence[1].trim());
          } catch (_) {}
        }
        const start = text.indexOf("{");
        const end = text.lastIndexOf("}");
        if (start !== -1 && end !== -1 && end > start) {
          const sliced = text.slice(start, end + 1);
          try {
            return JSON.parse(sliced);
          } catch (_) {}
          try {
            return JSON.parse(sliced.replace(/,\s*([}\]])/g, "$1"));
          } catch (_) {}
        }
        throw new Error(`响应不是有效JSON：${text.replace(/\s+/g, " ").slice(0, 160)}`);
      };
      const extractMessageContent = (data) => {
        const content = data?.choices?.[0]?.message?.content;
        if (typeof content === "string") return content;
        if (Array.isArray(content)) {
          return content
            .map((x) => {
              if (typeof x === "string") return x;
              if (x && typeof x.text === "string") return x.text;
              return "";
            })
            .join("\n")
            .trim();
        }
        if (typeof data?.output_text === "string") return data.output_text;
        return "";
      };

      const buildNetworkHint = (message) => {
        if (cfg.endpoint.startsWith("http://") && window.location.protocol === "https:") {
          return `${message}；当前页面是HTTPS，接口是HTTP，浏览器会拦截混合内容`;
        }
        if (/failed to fetch/i.test(message)) {
          return `${message}；可能是CORS、网络阻断或API服务不可达`;
        }
        return message;
      };

      let lastErr = null;
      for (let attempt = 1; attempt <= 2; attempt += 1) {
        let res;
        try {
          const headers = {
            "Content-Type": "application/json",
            "Accept": "application/json, text/plain;q=0.9, */*;q=0.8",
            "Authorization": `Bearer ${cfg.apiKey}`
          };
          if (/openrouter\.ai/i.test(cfg.endpoint)) {
            headers["HTTP-Referer"] = window.location.origin;
            headers["X-Title"] = "Interview Prep Demo";
          }
          res = await fetchWithTimeout(cfg.endpoint, {
            method: "POST",
            headers,
            body: JSON.stringify(body)
          }, 45000);
        } catch (err) {
          const msg = err && err.name === "AbortError"
            ? "AI请求超时（45s）"
            : buildNetworkHint(String(err?.message || err || "unknown"));
          lastErr = new Error(msg);
          if (attempt < 2) {
            await sleep(1200);
            continue;
          }
          throw lastErr;
        }

        const raw = await res.text();
        if (!res.ok) {
          const transient = res.status === 429 || res.status >= 500;
          let detail = raw.replace(/\s+/g, " ").slice(0, 180);
          try {
            const parsedErr = parseJsonLoose(raw);
            detail =
              parsedErr?.error?.message
              || parsedErr?.message
              || detail;
          } catch (_) {}
          lastErr = new Error(`HTTP ${res.status} ${detail}`);
          if (transient && attempt < 2) {
            await sleep(1200);
            continue;
          }
          throw lastErr;
        }

        let data;
        try {
          data = parseJsonLoose(raw);
        } catch (parseErr) {
          lastErr = new Error(`HTTP 200 但响应解析失败：${parseErr.message}`);
          if (attempt < 2) {
            await sleep(1200);
            continue;
          }
          throw lastErr;
        }

        const content = extractMessageContent(data);
        if (!content) {
          const errMsg = data?.error?.message || "未拿到模型文本输出";
          lastErr = new Error(errMsg);
          if (attempt < 2) {
            await sleep(1200);
            continue;
          }
          throw lastErr;
        }

        try {
          const parsed = parseJsonLoose(content);
          return {
            answer: parsed.answer || "未返回answer",
            keypoint: parsed.keypoint || "",
            keypointMarkdown: parsed.keypoint_markdown || ""
          };
        } catch (err) {
          lastErr = new Error(`模型JSON解析失败：${err.message}`);
          if (attempt < 2) {
            await sleep(1200);
            continue;
          }
          throw lastErr;
        }
      }

      throw lastErr || new Error("LLM请求失败");
    }

    function parseMarkdownTable(mdText) {
      const lines = mdText
        .split("\n")
        .map((x) => x.trim())
        .filter(Boolean);
      if (lines.length < 2) return null;
      const isRow = (line) => line.includes("|");
      if (!isRow(lines[0]) || !isRow(lines[1])) return null;
      const sep = lines[1].replace(/\|/g, "").trim();
      if (!/^[-:\s]+$/.test(sep)) return null;
      const splitRow = (line) =>
        line
          .split("|")
          .map((x) => x.trim())
          .filter((_, i, arr) => !(i === 0 && arr.length && arr[0] === "") && !(i === arr.length - 1 && arr[arr.length - 1] === ""));
      const headers = splitRow(lines[0]);
      const rows = [];
      for (let i = 2; i < lines.length; i += 1) {
        if (!isRow(lines[i])) break;
        rows.push(splitRow(lines[i]));
      }
      if (!headers.length || !rows.length) return null;
      return { headers, rows };
    }

    function extractTableFromText(text) {
      const lines = String(text || "").split("\n");
      for (let i = 0; i < lines.length - 1; i += 1) {
        const candidate = lines.slice(i).join("\n");
        const parsed = parseMarkdownTable(candidate);
        if (parsed) return candidate;
      }
      return "";
    }

    function renderRichSupplement(content) {
      const raw = String(content || "").trim();
      if (!raw) return "";
      const parsedTable = parseMarkdownTable(raw);
      if (parsedTable) {
        const th = parsedTable.headers.map((h) => `<th>${escapeHtml(h)}</th>`).join("");
        const tr = parsedTable.rows
          .map((row) => `<tr>${row.map((c) => `<td>${escapeHtml(c)}</td>`).join("")}</tr>`)
          .join("");
        return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
      }
      const lines = raw.split("\n");
      const bulletLines = lines.filter((l) => /^[-*]\s+/.test(l.trim()));
      if (bulletLines.length === lines.filter((l) => l.trim()).length && bulletLines.length > 0) {
        return `<ul>${bulletLines.map((l) => `<li>${escapeHtml(l.replace(/^[-*]\s+/, ""))}</li>`).join("")}</ul>`;
      }
      return `<div>${escapeHtml(raw).replace(/\n/g, "<br />")}</div>`;
    }

    function collectExportNotes() {
      const qa = loadQaStore();
      const qaArchive = loadQaArchiveStore();
      const result = [];
      const topicMap = new Map(topics.map((topic) => [topic.id, topic]));
      const pushRecordRows = (record, topic) => {
        if (!topic) return;
        const stats = topicChecklistStats(topic);
        record.history.forEach((item, askIdx) => {
          const supplement = String(item.distilledRich || item.distilledKeypoint || "").trim();
          const answer = String(item.answer || "").trim();
          if (!supplement && !answer) return;
          result.push({
            topicTitle: topic.title,
            topicLearned: stats.complete,
            sectionKey: record.sectionKey,
            sectionLabel: sectionLabel(record.sectionKey),
            itemIndex: Number(record.itemIndex || 0) + 1,
            askRound: askIdx + 1,
            askedAt: item.askedAt || "",
            question: item.question || "",
            answer,
            supplement
          });
        });
      };
      Object.entries(qa).forEach(([key, raw]) => {
        const parsed = parseQaKey(key);
        const record = normalizeQaRecord(raw, parsed);
        const topic = topicMap.get(record.topicId);
        pushRecordRows(record, topic);
      });
      qaArchive.forEach((raw) => {
        const record = normalizeQaRecord(raw, raw || {});
        const topic = topicMap.get(record.topicId);
        pushRecordRows(record, topic);
      });
      return result;
    }

      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

                  ${entry.askedAt ? `<div class="qa-history-time">${escapeHtml(entry.askedAt)}</div>` : ""}
                </div>
              `).join("")}
            </div>
          `
          : "";
        return `
          <div class="knowledge-row">
            <div class="knowledge-main">
              <div class="knowledge-bullet ${checked ? "done" : ""}">
                <input class="knowledge-bullet-check" type="checkbox" data-role="bullet-point" data-key="${checklistK}" ${checked ? "checked" : ""} />
                <div class="knowledge-bullet-text">
                  <div class="knowledge-bullet-main">${escapeHtml(mainText || rawItem)}</div>
                  ${reasonText ? `<div class="ai-reason-line">AI推荐理由：${escapeHtml(reasonText)}</div>` : ""}
                </div>
              </div>
              ${supplement ? `
                <div class="knowledge-extra">
                  <div class="extra-title">LLM提炼补充：</div>
                  ${renderRichSupplement(supplement)}
                </div>
              ` : ""}
            </div>
            <div class="knowledge-chat">
              <textarea data-role="qa-input" data-key="${k}" placeholder="对这个知识点有疑问？在这里提问..."></textarea>
              <div class="chat-actions">
                ${isCaseQuestionSection ? `<button class="btn" data-role="case-ref-answer" data-key="${k}" data-topic="${topicId}" data-section="${sectionKey}" data-index="${idx}" data-context="${escapeHtml(item)}">查看参考答案</button>` : ""}
                <button class="btn" data-role="qa-ask" data-key="${k}" data-topic="${topicId}" data-section="${sectionKey}" data-index="${idx}" data-context="${escapeHtml(item)}">向AI提问</button>
              </div>
              <div class="answer ${lastAnswer ? "" : "empty"}" data-role="qa-answer" data-key="${k}">${lastAnswer ? escapeHtml(lastAnswer) : "回答会显示在这里..."}</div>
              ${historyHtml}
            </div>
          </div>
        `;
      }).join("");
    }

    function fallbackBeginnerForTopic(topic) {
      if (Array.isArray(topic.aiBeginner) && topic.aiBeginner.length) {
        return topic.aiBeginner;
      }
      return [
        `方向定义：${topic.title} 主要解决什么问题。`,
        "输入输出：先明确输入信息，再定义输出结果。",

        "面试目标：能否在90秒内结构化表达该方向。"
      ];
    }

    function fallbackTextbookForTopic(topic) {
      const aiTextbook = topic.aiTextbook;
      if (aiTextbook && typeof aiTextbook === "object") {
        const ensureList = (value, fallback) => {
          if (Array.isArray(value) && value.length) return value;
          if (typeof value === "string" && value.trim()) return [value.trim()];
          return fallback;
        };
        return {
          core: ensureList(aiTextbook.core, ["先明确该方向在岗位中的业务价值。"]),
          framework: ensureList(aiTextbook.framework, ["定义问题 -> 构建框架 -> 给出可执行方案。"]),
          formula: String(aiTextbook.formula || "高质量回答 = 结构完整度 * 业务相关度 * 可执行性"),
          caseDemo: ensureList(aiTextbook.caseDemo, [`围绕“${topic.title}”准备1个真实场景：现状、问题、方案、结果。`]),
          pitfalls: ensureList(aiTextbook.pitfalls, ["只讲概念，不讲方法与落地。"]),

        };
