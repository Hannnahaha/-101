<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✅ 找工计划 - 面试岗位</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #111827;
      --sub: #4b5563;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --ok: #15803d;
      --muted-bg: #f3f4f6;
      --muted-text: #9ca3af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 136px 18px 40px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    h1, h2, h3 { margin: 0 0 10px; line-height: 1.35; }
    h1 { font-size: 28px; }
    h2 { font-size: 20px; }
    h3 { font-size: 16px; }
    p { margin: 8px 0; color: var(--sub); }
    ul { margin: 8px 0 0 20px; color: var(--sub); }
    li { margin: 5px 0; }
    .top-fixed-shell {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 120;
      background: transparent;
      padding: 12px 0;
    }
    .top-fixed-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 18px;
    }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      border: 1px solid #60a5fa;
      border-radius: 12px;
      background: #eff6ff;
      box-shadow: none;
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      border-radius: 999px;
      padding: 3px 9px;
      margin-right: 7px;
      margin-bottom: 6px;
      color: var(--primary);
      background: var(--primary-soft);
    }
    .date-chip {
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1e3a8a;
      padding: 1px 7px;
      white-space: nowrap;
    }
    .pill {
      font-size: 11px;
      font-weight: 600;
      border-radius: 7px;
      padding: 1px 7px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .p0 { color: #7c2d12; background: #ffedd5; }
    .p1 { color: #1e3a8a; background: #dbeafe; }
    .p2 { color: #166534; background: #dcfce7; }
    .layout {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .sidebar {
      position: sticky;
      top: 12px;
      max-height: calc(100vh - 30px);
      overflow: auto;
    }
    .topic-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .topic-link {
      text-decoration: none;
      color: inherit;
      display: block;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
      transition: border-color 0.15s ease;
    }
    .topic-link:hover { border-color: #93c5fd; }
    .topic-link.active {
      border-color: #60a5fa;
      background: #eff6ff;
    }
    .meta {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
    .topic-content .url-box {
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      color: #374151;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .track-list {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
    }
    .track-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px 10px;
      margin: 7px 0;
      background: #fff;
    }
    .track-item input[type="checkbox"] {
      margin-top: 2px;
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
    }
    .track-item.done {
      background: var(--muted-bg);
      color: var(--muted-text);
      border-color: #e5e7eb;
    }
    .track-item.done .track-text {
      text-decoration: line-through;
    }
    .textbook-block {
      margin-top: 12px;
      border-top: 1px solid #e5e7eb;
      padding-top: 12px;
    }
    .textbook-section {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #eef2f7;
      background: #fafcff;
      border-radius: 8px;
    }
    .textbook-section h4 {
      margin: 0 0 6px;
      font-size: 14px;
      color: #1e3a8a;
    }
    .formula {
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      color: #374151;
      margin: 6px 0;
    }
    .script-box {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      color: #065f46;
      margin-top: 8px;
    }
    .stats {
      margin-top: 8px;
      font-size: 13px;
      color: #374151;
      padding: 8px 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }
    .hero-title-wrap {
      flex: 1;
      min-width: 0;
    }
    .hero-sub {
      margin: 6px 0 0;
      font-size: 13px;
      color: #334155;
    }
    .hero-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hero-actions-text {
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      white-space: nowrap;
    }
    .step-title {
      font-size: 12px;
      color: #374151;
      margin: 6px 0 6px;
      font-weight: 600;
    }
    .selected-model {
      margin-top: 6px;
      font-size: 12px;
      color: #1e3a8a;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 6px 8px;
    }
    .llm-config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .llm-config label {
      font-size: 12px;
      color: #4b5563;
      display: block;
      margin-bottom: 4px;
    }
    .llm-config input {
      width: 100%;
      font-size: 12px;
      padding: 7px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
    }
    .llm-config input[readonly] {
      background: #f3f4f6;
      color: #6b7280;
    }
    .llm-config .full { grid-column: 1 / -1; }
    .llm-config-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .floating-export {
      padding: 0;
      background: transparent;
      display: flex;
      flex-direction: row;
      gap: 8px;
    }
    .export-panel-title {
      display: none;
    }
    .export-actions {
      display: flex;
      flex-direction: row;
      gap: 8px;
    }
    .export-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .export-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }
    .export-icon.word { color: #185abd; }
    .export-icon.excel { color: #107c41; }
    .export-btn {
      background: #1e3a8a !important;
      border-color: #1e3a8a !important;
      color: #fff !important;
      font-size: 14px;
      font-weight: 800;
      padding: 11px 18px;
      border-width: 2px;
      box-shadow: 0 6px 16px rgba(30, 58, 138, 0.35);
      border-radius: 12px;
      letter-spacing: 0.2px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .export-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(30, 58, 138, 0.42);
    }
    .preset-row {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .preset-btn {
      font-size: 12px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #374151;
      border-radius: 6px;
      padding: 5px 9px;
      cursor: pointer;
    }
    .preset-btn:hover {
      border-color: #93c5fd;
      color: #1d4ed8;
      background: #eff6ff;
    }
    .preset-btn.active {
      border-color: #60a5fa;
      background: #dbeafe;
      color: #1e3a8a;
      font-weight: 600;
    }
    .advanced-config {
      margin-top: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 6px 8px;
      background: #fcfcfd;
    }
    .advanced-config summary {
      cursor: pointer;
      color: #4b5563;
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }
    .preset-note {
      margin-top: 6px;
      font-size: 12px;
      color: #6b7280;
    }
    .btn {
      font-size: 12px;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    .llm-status {
      font-size: 12px;
      color: #6b7280;
    }
    .knowledge-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 10px;
      margin: 8px 0;
      padding: 8px;
      border: 1px solid #eef2f7;
      border-radius: 8px;
      background: #ffffff;
    }
    .knowledge-main {
      font-size: 14px;
      color: #334155;
    }
    .knowledge-main ul {
      margin: 0;
      padding-left: 18px;
    }
    .knowledge-main li {
      margin: 0;
    }
    .knowledge-extra {
      margin-top: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      background: #ecfeff;
      border: 1px solid #bae6fd;
      color: #0c4a6e;
      font-size: 12px;
    }
    .knowledge-extra .extra-title {
      font-weight: 600;
      margin-bottom: 6px;
    }
    .knowledge-extra table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      background: #fff;
      color: #0f172a;
    }
    .knowledge-extra th,
    .knowledge-extra td {
      border: 1px solid #cbd5e1;
      padding: 4px 6px;
      text-align: left;
      vertical-align: top;
      font-size: 12px;
    }
    .knowledge-extra th {
      background: #eff6ff;
      font-weight: 600;
    }
    .knowledge-extra ul {
      margin: 6px 0 0 18px;
      color: #0c4a6e;
    }
    .knowledge-chat {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px;
    }
    .knowledge-chat textarea {
      width: 100%;
      min-height: 62px;
      font-size: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 6px;
      resize: vertical;
      background: #fff;
    }
    .knowledge-chat .chat-actions {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }
    .knowledge-chat .answer {
      margin-top: 6px;
      font-size: 12px;
      color: #1f2937;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 6px;
      white-space: pre-wrap;
      max-height: 200px;
      overflow: auto;
    }
    .knowledge-chat .answer.empty {
      color: #9ca3af;
    }
    .qa-history {
      margin-top: 8px;
      border-top: 1px dashed #d1d5db;
      padding-top: 8px;
    }
    .qa-history-title {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .qa-history-item {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 6px;
      font-size: 12px;
      color: #1f2937;
    }
    .qa-history-q {
      margin-bottom: 4px;
      color: #1e3a8a;
    }
    .qa-history-a {
      white-space: pre-wrap;
      margin-bottom: 4px;
      color: #111827;
    }
    .qa-history-k {
      border-top: 1px dashed #e5e7eb;
      margin-top: 4px;
      padding-top: 4px;
      color: #0c4a6e;
    }
    .qa-history-time {
      margin-top: 4px;
      color: #6b7280;
      font-size: 11px;
    }
    .industry-block {
      margin-top: 10px;
      border: 1px solid #dbeafe;
      border-radius: 8px;
      background: #f8fbff;
      padding: 8px;
    }
    .industry-block h4 {
      margin: 0 0 6px;
      font-size: 14px;
      color: #1e3a8a;
    }
    .industry-tags {
      margin-top: 6px;
      font-size: 12px;
      color: #334155;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 6px 8px;
    }
    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #6b7280;
    }
    .hidden { display: none !important; }
    .imported-summary {
      margin-top: 10px;
      font-size: 13px;
      color: #374151;
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      border-radius: 8px;
      padding: 10px;
      white-space: pre-wrap;
    }
    @media (max-width: 980px) {
      .hero {
        gap: 8px;
      }
      .wrap { padding-top: 154px; }
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; max-height: none; }
      .knowledge-row { grid-template-columns: 1fr; }
      .llm-config-grid { grid-template-columns: 1fr; }
      .hero-actions-text {
        font-size: 13px;
      }
      .floating-export {
        width: auto;
      }
      .export-actions {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="top-fixed-shell">
    <div class="top-fixed-inner">
      <section class="card hero">
      <div class="hero-title-wrap">
        <h1 id="heroTitle">面试补强路线（前3天高优先级压缩）</h1>
      </div>
      <div class="hero-actions">
        <span class="hero-actions-text">导出AI对话学习笔记</span>
        <div class="floating-export">
          <div class="export-panel-title">导出AI对话学习笔记</div>
          <div class="export-actions">
            <button id="exportWordBtn" class="btn export-btn"><span class="export-label"><span class="export-icon word">W</span>Word格式</span></button>
            <button id="exportExcelBtn" class="btn export-btn"><span class="export-label"><span class="export-icon excel">X</span>Excel格式</span></button>
          </div>
        </div>
        <span id="llmStatus" class="llm-status">检查配置中...</span>
      </div>
      </section>
    </div>
  </div>

  <div class="wrap">

    <section class="layout">
      <aside class="card sidebar">
        <div id="topicList" class="topic-list"></div>
      </aside>

      <main id="topicDetail" class="card topic-content"></main>
    </section>

    <div class="footer">
      说明：进度保存在浏览器 localStorage；如果你清理浏览器站点数据，勾选状态会重置。
    </div>
  </div>

  <script>
    if (window.location.pathname.endsWith(`/${atob("aW50ZXJ2aWV3X2d1aWRlLmh0bWw=")}`)) {
      const target = `interview_prep_level2.html${window.location.search || ""}${window.location.hash || ""}`;
      window.location.replace(target);
    }

    let topics = [
      {
        id: "topic-mode-design",
        title: "模式设计与发展规划（JD-1）",
        priority: "P0",
        day: "Day1",
        why: "这是岗位最核心的战略题，几乎必问。",
        knowledge: [
          "模式库：直邮、半托管、海外仓、本地履约、混合网络。",
          "决策框架：成本、时效、体验、合规风险四维平衡。",
          "分品类逻辑：轻小件、重货、高退货品的差异化模式。",
          "动态切换：从试点到扩量的阈值和切换机制。"
        ],
        action: [
          "做一页“模式决策表”：市场 x 品类 x 模式 x 预期成本/时效。",
          "准备1个‘从全托管到半托管’的结构化回答。"
        ],
        interview: "回答时先给框架，再给参数，再给试点推进路径。"
      },
      {
        id: "topic-cross-border-network",
        title: "跨境物流网络拆解（头程-清关-尾程-逆向）",
        priority: "P0",
        day: "Day1",
        why: "你目前薄弱点在这里，补齐后会显著提升可信度。",
        knowledge: [
          "头程：空/海/铁的时效成本特征与旺季运力风险。",
          "清关：申报准确性、查验率、税费不确定性管理。",
          "尾程：多承运商路由、区域时效分层、签收稳定性。",
          "逆向：退货分层处置（二售/销毁/返修）与成本止损。"
        ],
        action: [
          "画出一张跨境履约全链路图，并标注每段KPI。",
          "整理3个常见异常：清关延迟、尾程爆仓、退货过高。"
        ],
        interview: "把问题定位到链路段，而不是泛泛说‘物流不好’。"
      },
      {
        id: "topic-cost-model",
        title: "履约成本与订单贡献模型",
        priority: "P0",
        day: "Day1",
        why: "战略岗需要‘算得明白’，不是只会讲增长。",
        knowledge: [
          "成本结构：头程+仓储+操作+尾程+逆向+损耗。",
          "订单贡献：分国家、品类、模式做单位经济核算。",
          "边际变化：单量上升后成本曲线不一定线性下降。",
          "时效升级的代价：服务水平与毛利之间的边界。"
        ],
        action: [
          "给出1个国家样例，做‘快方案 vs 稳方案’成本对比。",
          "准备‘为什么GMV涨但利润恶化’的解释模板。"
        ],
        interview: "先报拆解口径，再讲结果，不跳步骤。"
      },
      {
        id: "topic-operating-kpi-tree",
        title: "履约经营指标树（JD-3）",
        priority: "P0",
        day: "Day2",
        why: "面试会看你是否能从经营角度驱动落地。",
        knowledge: [
          "北极星建议：履约成本/订单 + 准时妥投率。",
          "二级指标：OTD、签收时效、缺货率、库存周转天数。",
          "三级指标：承运商SLA、仓作业时长、清关通过率。",
          "预警机制：按国家/模式/承运商设阈值触发。"
        ],
        action: [
          "输出1张‘北极星-二级-三级’指标树图。",
          "给每个指标写1句‘异常时我会怎么查’。"
        ],
        interview: "强调‘指标用于决策’，不是只做看板。"
      },
      {
        id: "topic-root-cause-method",
        title: "经营异常根因分析方法",
        priority: "P0",
        day: "Day2",
        why: "你现有材料偏运营分析，可在这里建立差异化。",
        knowledge: [
          "切片维度：国家、渠道、履约模式、承运商、仓。",
          "贡献度拆分：找主因，不被平均数误导。",
          "链路回溯：问题发生段位与责任归属。",
          "策略闭环：短期止损 + 中期优化 + 长期机制。"
        ],
        action: [
          "练1题：时效变好但利润变差如何拆。",
          "练1题：投诉上升但OTD稳定如何解释。"
        ],
        interview: "用‘先确认现象-再分层-后归因-给方案’四步法。"
      },
      {
        id: "topic-interview-templates",
        title: "高频面试题模板（3大类）",

    function safeSlug(text, idx) {
      const base = String(text || "")
        .toLowerCase()
        .replace(/[^a-z0-9\u4e00-\u9fa5]+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
      return base ? `topic-custom-${base}` : `topic-custom-${idx + 1}`;
    }

    function splitToLines(text) {
      return String(text || "")
        .split(/\n|。|；|;|！|!|\?|？/)
        .map((x) => x.trim())
        .filter((x) => x.length >= 6);
    }

    function tokenizeFocus(text) {
      return String(text || "")
        .toLowerCase()
        .replace(/[^a-z0-9\u4e00-\u9fa5]+/g, " ")
        .split(/\s+/)
        .filter((x) => x && x.length >= 2);
    }

    function collectMaterialNames(payload) {
      const lm = payload?.learningMaterials || {};
      const notes = Array.isArray(lm.knowledgeNotes) ? lm.knowledgeNotes : [];
      const resumes = Array.isArray(lm.resumeFiles) ? lm.resumeFiles : [];
      return [...notes, ...resumes].map((f) => f?.name).filter(Boolean);
    }

    function extractContextFromJD(payload, focus) {
      const jdText = String(payload?.jobDescription || "");
      const lines = splitToLines(jdText);
      if (!lines.length) return [];
      const tokens = tokenizeFocus(focus);
      const behaviorMode = /(behavior|behaviour|行为|软技能|沟通|抗压|领导力|协作|动机)/i.test(focus);
      const behaviorRegex = /(behavior|behaviour|行为|沟通|抗压|领导力|协作|动机|价值观|冲突|复盘|表达)/i;

      const scored = lines.map((line) => {
        const lower = line.toLowerCase();
        let score = 0;
        tokens.forEach((t) => {
          if (lower.includes(t)) score += 2;
        });
        if (behaviorMode && behaviorRegex.test(line)) score += 2;
        if (/负责|需要|能力|经验|优先|熟悉|理解|分析|推动/.test(line)) score += 1;
        return { line, score };
      });
      return scored
        .filter((x) => x.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 4)
        .map((x) => x.line);
    }

    function priorityByIndex(i) {
      if (i < 3) return "P0";
      if (i < 6) return "P1";
      return "P2";
    }

    function parseDateLocal(dateStr) {
      if (!dateStr) return null;
      const match = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return null;
      const y = Number(match[1]);
      const m = Number(match[2]) - 1;
      const d = Number(match[3]);
      return new Date(y, m, d);
    }

    function computePrepDays(targetDate) {
      const target = parseDateLocal(targetDate);
      if (!target || Number.isNaN(target.getTime())) return 5;
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffMs = target.getTime() - today.getTime();
      const diffDays = Math.ceil(diffMs / 86400000);
      return Math.max(1, diffDays);
    }

    function buildCountdownLabels(prepDays) {
      return Array.from({ length: prepDays }, (_, i) => `D-${prepDays - i}`);
    }

    function dayByIndex(index, totalTopics, labels) {
      if (!labels.length) return "D-1";
      if (totalTopics <= 1) return labels[0];
      const bucket = Math.floor((index * labels.length) / totalTopics);
      return labels[Math.min(labels.length - 1, Math.max(0, bucket))];
    }

    function categoryOrderScore(category) {
      const order = {
        technical: 0,
        crm: 0,
        experience: 1,
        behavioral: 2,
        general: 2,
        case: 3
      };
      return Object.prototype.hasOwnProperty.call(order, category) ? order[category] : 9;
    }

    function moduleOrderScore(moduleKey) {
      const order = {
        technical: 0,
        experience: 1,
        behavioral: 2,
        case: 3
      };
      return Object.prototype.hasOwnProperty.call(order, moduleKey) ? order[moduleKey] : 9;
    }

    function normalizeModuleKey(topic) {
      const mk = String(topic?.moduleKey || "").trim();
      if (["technical", "experience", "behavioral", "case"].includes(mk)) return mk;
      const cat = topic?.category || inferFocusCategory(`${topic?.title || ""} ${topic?.why || ""}`);
      if (cat === "experience") return "experience";
      if (cat === "behavioral") return "behavioral";
      if (cat === "case") return "case";
      return "technical";
    }

    function formatDateNode(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, "0");

      return `${y}-${m}-${d}`;
    }

    function addDays(baseDate, days) {
      const d = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
      d.setDate(d.getDate() + days);

    function buildAiBlueprintMap(payload) {
      const list = Array.isArray(payload?.aiTopicBlueprints) ? payload.aiTopicBlueprints : [];
      const map = new Map();
      list.forEach((item) => {
        const focusKey = normalizeFocusKey(item?.focus);
        const moduleKey = String(item?.moduleKey || item?.module_key || "").trim();
        if (!focusKey) return;
        if (moduleKey) {
          map.set(`${moduleKey}::${focusKey}`, item);
        }
        map.set(focusKey, item);
      });
      return map;
    }

    function inferFocusCategory(focus) {
      const text = String(focus || "");
      if (/(behavior|behaviour|行为|软技能|求职动机|抗压|领导力|协作|冲突)/i.test(text)) return "behavioral";
      if (/(crm|会员|私域|生命周期|留存|分层运营|触达)/i.test(text)) return "crm";
      if (/(technical|技术|算法|数据|架构|系统|模型|sql|python|统计|实验)/i.test(text)) return "technical";
      if (/(经历|项目|star|简历|深挖|复盘)/i.test(text)) return "experience";
      if (/(case|情景|案例|估算|市场进入|策略模拟|商业分析题)/i.test(text)) return "case";
      return "general";
    }

    function buildTopicsFromHandoff(payload) {
      const structuredList = Array.isArray(payload.prepFocusItemsFinal) && payload.prepFocusItemsFinal.length
        ? payload.prepFocusItemsFinal
            .map((x, idx) => ({
              focus: String(x?.focus || "").trim(),
              moduleKey: String(x?.moduleKey || "").trim(),
              moduleTitle: String(x?.moduleTitle || "").trim(),
              idx
            }))
            .filter((x) => x.focus)
        : [];
      const fallbackList = Array.isArray(payload.prepFocusListFinal) && payload.prepFocusListFinal.length
        ? payload.prepFocusListFinal.filter(Boolean).map((focus, idx) => ({ focus, moduleKey: "", moduleTitle: "", idx }))
        : (Array.isArray(payload.prepFocusList) ? payload.prepFocusList.filter(Boolean).map((focus, idx) => ({ focus, moduleKey: "", moduleTitle: "", idx })) : []);
      const list = structuredList.length ? structuredList : fallbackList;
      if (!list.length) return [];
      const prepDays = computePrepDays(payload?.targetDate);
      const countdownLabels = buildCountdownLabels(prepDays);
      const materialNames = collectMaterialNames(payload);
      const aiBlueprintMap = buildAiBlueprintMap(payload);
      const prepared = list.map((item) => {
        const focus = item.focus;
        const jdHints = extractContextFromJD(payload, focus);
        const category = item.moduleKey || inferFocusCategory(focus);
        const focusKey = normalizeFocusKey(focus);
        const aiBlueprint = aiBlueprintMap.get(`${item.moduleKey}::${focusKey}`) || aiBlueprintMap.get(focusKey) || null;
        return { focus, idx: item.idx, jdHints, category, aiBlueprint, moduleKey: item.moduleKey, moduleTitle: item.moduleTitle };
      }).sort((a, b) => {
        const moduleScoreA = moduleOrderScore(a.moduleKey);
        const moduleScoreB = moduleOrderScore(b.moduleKey);
        if (moduleScoreA !== moduleScoreB) return moduleScoreA - moduleScoreB;
        const scoreA = categoryOrderScore(a.category);
        const scoreB = categoryOrderScore(b.category);
        if (scoreA !== scoreB) return scoreA - scoreB;
        return a.idx - b.idx;
      });

      return prepared.map((item, sortedIdx) => {
        const generated = item.aiBlueprint
          ? {
              knowledge: Array.isArray(item.aiBlueprint.knowledge) && item.aiBlueprint.knowledge.length
                ? item.aiBlueprint.knowledge
                : buildTopicByCategory(item.category, item.focus, item.jdHints, materialNames).knowledge,
              action: Array.isArray(item.aiBlueprint.action) && item.aiBlueprint.action.length
                ? item.aiBlueprint.action
                : buildTopicByCategory(item.category, item.focus, item.jdHints, materialNames).action,
              interview: String(item.aiBlueprint.interview || "").trim() || buildTopicByCategory(item.category, item.focus, item.jdHints, materialNames).interview
            }

    function attachScheduleMetadata(activeTopics, payload) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const target = parseDateLocal(payload?.targetDate) || addDays(today, Math.max(7, activeTopics.length));
      const targetDate = target.getTime() < today.getTime() ? today : target;
      const totalSpan = Math.max(0, Math.ceil((targetDate.getTime() - today.getTime()) / 86400000));

      const orderedTasks = [...activeTopics].map((t, idx) => ({
        ...t,
        _moduleKey: normalizeModuleKey(t),
        _originIdx: idx
      })).sort((a, b) => {
        const sa = moduleOrderScore(a._moduleKey);
        const sb = moduleOrderScore(b._moduleKey);
        if (sa !== sb) return sa - sb;
        return a._originIdx - b._originIdx;
      });

      orderedTasks.forEach((t, idx) => {
        const offset = orderedTasks.length <= 1 ? 0 : Math.round((idx * totalSpan) / (orderedTasks.length - 1));
        t._scheduledDate = addDays(today, offset);
      });
      const scheduleById = new Map(orderedTasks.map((t) => [t.id, { scheduledDate: t._scheduledDate, moduleKey: t._moduleKey }]));
      return activeTopics.map((topic) => {
        const scheduled = scheduleById.get(topic.id);
        return {
          ...topic,
          _scheduledDate: scheduled?.scheduledDate || null,
          _moduleKey: scheduled?.moduleKey || normalizeModuleKey(topic)
        };
      });
    }

    function applyLevel1Handoff() {
      let payload = null;
      try {
        payload = JSON.parse(localStorage.getItem(level1HandoffKey) || "null");
      } catch (e) {
        payload = null;
      }
      if (!payload) {
        currentLevel1Payload = null;
        topics = JSON.parse(JSON.stringify(defaultTopics));
        document.title = "✅ 找工计划 - 面试岗位";
        topics = attachScheduleMetadata(topics, null);
        return;
      }

      currentLevel1Payload = payload;
      const generated = buildTopicsFromHandoff(payload);
      topics = generated.length ? generated : JSON.parse(JSON.stringify(defaultTopics));
      topics = attachScheduleMetadata(topics, payload);

      const company = payload.companyName || "目标公司";
      const role = payload.roleName || "目标岗位";
      const positionSummary = [company, role].filter(Boolean).join(" ");
      document.title = `✅ 找工计划 - ${positionSummary || "面试岗位"}`;
      heroTitleEl.textContent = `${company}｜${role} 面试补强路线`;

      const currentId = getTopicIdFromHash();
      if (!topics.some((t) => t.id === currentId)) {
        window.location.hash = topics[0]?.id || "";
      }
    }

    }

    function topicChecklistStats(topic) {
      const list = loadChecklist();
      const total = (topic.knowledge?.length || 0) + (topic.action?.length || 0);
      let done = 0;
      (topic.knowledge || []).forEach((_, i) => {
        if (list[checklistKey(topic.id, "knowledge", i)]) done += 1;
      });
      (topic.action || []).forEach((_, i) => {
        if (list[checklistKey(topic.id, "action", i)]) done += 1;
      });
      return { done, total, complete: total > 0 && done === total };
    }

    function qaKey(topicId, sectionKey, idx) {

    function parseQaKey(key) {
      const [topicId = "", sectionKey = "", idxStr = "0"] = String(key || "").split("::");
      const idxNum = Number(idxStr);
      return {
        topicId,
        sectionKey,
        itemIndex: Number.isFinite(idxNum) ? idxNum : 0
      };
    }

    function normalizeQaHistoryItem(item) {
      if (!item || typeof item !== "object") return null;
      const question = String(item.question || "").trim();
      const answer = String(item.answer || item.lastAnswer || "").trim();
      const distilledKeypoint = String(item.distilledKeypoint || item.keypoint || "").trim();
      const distilledRich = String(item.distilledRich || item.keypointMarkdown || "").trim();
      const askedAt = String(item.askedAt || item.createdAt || "").trim();
      if (!question && !answer && !distilledKeypoint && !distilledRich) return null;
      return { question, answer, distilledKeypoint, distilledRich, askedAt };
    }

    function normalizeQaRecord(record, fallbackMeta = {}) {
      const base = record && typeof record === "object" ? record : {};
      const mergedMeta = {
        topicId: String(base.topicId || fallbackMeta.topicId || "").trim(),
        sectionKey: String(base.sectionKey || fallbackMeta.sectionKey || "").trim(),
        itemIndex: Number.isFinite(Number(base.itemIndex)) ? Number(base.itemIndex) : Number(fallbackMeta.itemIndex || 0),
        context: String(base.context || fallbackMeta.context || "").trim()
      };
      const history = [];
      if (Array.isArray(base.history)) {
        base.history.forEach((item) => {
          const normalized = normalizeQaHistoryItem(item);
          if (normalized) history.push(normalized);
        });
      }
      if (!history.length) {
        const legacy = normalizeQaHistoryItem({
          question: base.question,
          answer: base.lastAnswer,
          distilledKeypoint: base.distilledKeypoint,
          distilledRich: base.distilledRich,
          askedAt: base.askedAt
        });
        if (legacy) history.push(legacy);
      }
      return { ...mergedMeta, history };
    }

    function pickJdClues(payload, matchRegex) {
      const jdText = String(payload?.jobDescription || "");
      if (!jdText) return [];
      const lines = splitToLines(jdText);
      if (!lines.length) return [];
      if (!matchRegex || typeof matchRegex.test !== "function") {
        return lines
          .filter((line) => /负责|需要|能力|经验|目标|优化|增长|分析|协同|管理|策略/.test(line))
          .slice(0, 4);
      }
      return lines
        .filter((line) => matchRegex.test(line))
        .slice(0, 4);
    }

    function simpleHash(text) {
      const str = String(text || "");
      let h = 2166136261;
      for (let i = 0; i < str.length; i += 1) {
        h ^= str.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      }
      return (h >>> 0).toString(36);
    }

    function buildPayloadScopeKey(payload) {
      if (!payload || typeof payload !== "object") return "default";
      const seed = [
        payload.createdAt || "",
        payload.companyName || "",
        payload.roleName || "",
        String(payload.jobDescription || "").slice(0, 800),
        payload.targetDate || ""
      ].join("||");
      return simpleHash(seed);
    }

    function buildIndustrySections(topic) {
      const ai = topic?.aiIndustry && typeof topic.aiIndustry === "object" ? topic.aiIndustry : {};
      const payload = currentLevel1Payload || {};
      const profile = detectIndustryProfile(topic);
      const companyName = String(payload.companyName || "目标公司").trim();
      const roleName = String(payload.roleName || "目标岗位").trim();
      const ensureList = (value, fallback) => {
        if (Array.isArray(value) && value.length) return value.map((x) => String(x || "").trim()).filter(Boolean);
        if (typeof value === "string" && value.trim()) return [value.trim()];
        return fallback;
      };
      const mergeWithBaseline = (value, baseline) => {
        const aiList = ensureList(value, []);
        const merged = [...baseline];
        aiList.forEach((line) => {
          const text = String(line || "").trim();
          if (!text) return;
          if (merged.some((x) => x.includes(text) || text.includes(x))) return;
          merged.push(text);
        });
        return merged;
      };
      const sourceHint = Array.isArray(topic?.sourceHints) && topic.sourceHints.length
        ? topic.sourceHints.map((x) => `JD定制线索：${x}`)
        : profile.jdClues.map((x) => `JD定制线索：${x}`);
      const jdCue1 = sourceHint[0] ? sourceHint[0].replace(/^JD定制线索：/, "") : `${companyName} ${roleName}`;
      const jdCue2 = sourceHint[1] ? sourceHint[1].replace(/^JD定制线索：/, "") : `${roleName}需要跨模块协同`;
      const industryFormulaLine = profile.id === "game"
        ? `关键公式（结合JD：${jdCue1}）：LTV/CAC = 用户生命周期价值 / 获客成本；当LTV/CAC > 1代表增长基本可持续。`
        : profile.id === "regional_sales"
          ? `关键公式（结合JD：${jdCue1}）：动销率 = 有销量门店数 / 已铺货门店数；它反映渠道质量而非单纯铺货规模。`
          : profile.id === "logistics"
            ? `关键公式（结合JD：${jdCue1}）：OTD = 准时签收订单数 / 总订单数；它直接衡量履约稳定性与客户体验。`
            : `关键公式（结合JD：${jdCue1}）：ROI = (项目收益 - 项目投入) / 项目投入；用于判断资源配置是否值得继续加码。`;
      const scenarioLine = `面试场景与误区（结合JD：${jdCue2}）：请用一个真实业务场景说明关键stakeholder如何影响结果；常见误区是只讲总部策略，不讲一线执行链路。`;
      const valueChain = mergeWithBaseline(ai.valueChain, [

      const coreConcepts = mergeWithBaseline(ai.coreConcepts, [

      ]);
      const competition = mergeWithBaseline(ai.competition, [
        `竞争格局：围绕${companyName}识别头部与直接竞争者，比较“客群-渠道-产品/服务-效率”。`,

      const trends = mergeWithBaseline(ai.trends, [

        `趋势拆解（结合JD：${jdCue1}）：从渠道变革、用户行为变化、数字化升级三个维度看岗位影响。`,

      ]);
      return [

        { code: "1B", sectionKey: "industry_1B", title: "行业核心概念", items: [...coreConcepts, ...sourceHint] },
        { code: "1C", sectionKey: "industry_1C", title: "行业竞争格局", items: [...competition, ...sourceHint] },
        { code: "1D", sectionKey: "industry_1D", title: "行业重要趋势", items: [...trends, ...sourceHint] },
        { code: "1E", sectionKey: "industry_1E", title: "其他关键维度", items: [...extra, ...sourceHint] }
      ];
    }

        exportNotesAsWord();
      });
      exportExcelBtn.addEventListener("click", () => {

    async function callLLM(config, userQuestion, contextText) {
      const systemPrompt = [
        "你是供应链与物流学习助教。",
        "请根据学习者的问题和给定知识点上下文回答。",
        "必须返回严格JSON格式：{\"answer\":\"...\",\"keypoint\":\"...\",\"keypoint_markdown\":\"...\"}",
        "answer用于详细解释；keypoint用于提炼并回写为一句核心知识点。",
        "keypoint_markdown用于提炼并回写可结构化内容（可包含markdown表格/列表）。",
        "keypoint长度控制在40字内。"
      ].join("\n");
      const body = {
        model: config.model,
        temperature: 0.2,
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: `知识点上下文：${contextText}\n学习者问题：${userQuestion}` }
        ]
      };
      const res = await fetch(config.endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${config.apiKey}`
        },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`HTTP ${res.status} ${errText.slice(0, 120)}`);
      }
      const data = await res.json();
      const content = data?.choices?.[0]?.message?.content || "";
      const start = content.indexOf("{");
      const end = content.lastIndexOf("}");
      if (start === -1 || end === -1) {
        throw new Error("模型返回不是JSON");
      }
      const parsed = JSON.parse(content.slice(start, end + 1));
      return {
        answer: parsed.answer || "未返回answer",
        keypoint: parsed.keypoint || "",
        keypointMarkdown: parsed.keypoint_markdown || ""
      };
    }

    function parseMarkdownTable(mdText) {
      const lines = mdText
        .split("\n")
        .map((x) => x.trim())
        .filter(Boolean);
      if (lines.length < 2) return null;
      const isRow = (line) => line.includes("|");
      if (!isRow(lines[0]) || !isRow(lines[1])) return null;
      const sep = lines[1].replace(/\|/g, "").trim();
      if (!/^[-:\s]+$/.test(sep)) return null;
      const splitRow = (line) =>
        line
          .split("|")
          .map((x) => x.trim())
          .filter((_, i, arr) => !(i === 0 && arr.length && arr[0] === "") && !(i === arr.length - 1 && arr[arr.length - 1] === ""));
      const headers = splitRow(lines[0]);
      const rows = [];
      for (let i = 2; i < lines.length; i += 1) {
        if (!isRow(lines[i])) break;
        rows.push(splitRow(lines[i]));
      }
      if (!headers.length || !rows.length) return null;
      return { headers, rows };
    }

    function extractTableFromText(text) {
      const lines = String(text || "").split("\n");
      for (let i = 0; i < lines.length - 1; i += 1) {
        const candidate = lines.slice(i).join("\n");
        const parsed = parseMarkdownTable(candidate);
        if (parsed) return candidate;
      }
      return "";
    }

    function renderRichSupplement(content) {
      const raw = String(content || "").trim();
      if (!raw) return "";
      const parsedTable = parseMarkdownTable(raw);
      if (parsedTable) {
        const th = parsedTable.headers.map((h) => `<th>${escapeHtml(h)}</th>`).join("");
        const tr = parsedTable.rows
          .map((row) => `<tr>${row.map((c) => `<td>${escapeHtml(c)}</td>`).join("")}</tr>`)
          .join("");
        return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
      }
      const lines = raw.split("\n");
      const bulletLines = lines.filter((l) => /^[-*]\s+/.test(l.trim()));
      if (bulletLines.length === lines.filter((l) => l.trim()).length && bulletLines.length > 0) {
        return `<ul>${bulletLines.map((l) => `<li>${escapeHtml(l.replace(/^[-*]\s+/, ""))}</li>`).join("")}</ul>`;
      }
      return `<div>${escapeHtml(raw).replace(/\n/g, "<br />")}</div>`;
    }

    function collectExportNotes() {
      const qa = loadQaStore();
      const result = [];
      const topicMap = new Map(topics.map((topic) => [topic.id, topic]));
      Object.entries(qa).forEach(([key, raw]) => {
        const parsed = parseQaKey(key);
        const record = normalizeQaRecord(raw, parsed);
        const topic = topicMap.get(record.topicId);
        if (!topic) return;
        const stats = topicChecklistStats(topic);
        record.history.forEach((item, askIdx) => {
          const supplement = String(item.distilledRich || item.distilledKeypoint || "").trim();
          const answer = String(item.answer || "").trim();
          if (!supplement && !answer) return;
          result.push({
            topicTitle: topic.title,
            topicLearned: stats.complete,
            sectionKey: record.sectionKey,
            sectionLabel: sectionLabel(record.sectionKey),
            itemIndex: Number(record.itemIndex || 0) + 1,
            askRound: askIdx + 1,
            askedAt: item.askedAt || "",
            question: item.question || "",
            answer,
            supplement
          });
        });
      });
      return result;
    }

    function downloadBlob(content, mimeType, fileName) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function getTopicIdFromHash() {
      const raw = window.location.hash.replace("#", "").trim();
      const id = decodeURIComponent(raw || "");
      if (!id) return topics[0].id;
      const exists = topics.some((t) => t.id === id);
      return exists ? id : topics[0].id;
    }

    function priorityClass(p) {
      if (p === "P0") return "p0";
      if (p === "P1") return "p1";
      return "p2";
    }

    function renderSidebar() {
      const currentId = getTopicIdFromHash();
      topicListEl.innerHTML = topics.map((t) => {
        const stats = topicChecklistStats(t);
        const cls = [
          "topic-link",
          t.id === currentId ? "active" : "",
          stats.complete ? "learned" : ""
        ].join(" ").trim();
        const moduleKey = t._moduleKey || normalizeModuleKey(t);
        const scheduleDate = t._scheduledDate ? formatDateNode(t._scheduledDate) : "";
        const metaParts = [moduleLabel(moduleKey), scheduleDate || t.day, `${stats.done}/${stats.total}`].filter(Boolean);
        return `
          <a class="${cls}" href="#${encodeURIComponent(t.id)}">
            <div><strong>${t.title}</strong> <span class="pill ${priorityClass(t.priority)}">${t.priority}</span></div>
            <div class="meta">${metaParts.join(" · ")}</div>
          </a>
        `;
      }).join("");

    function renderTrackList(items, topicId, listType) {
      const list = loadChecklist();
      return `
        <ul class="track-list">
          ${items.map((text, idx) => {
            const k = checklistKey(topicId, listType, idx);
            const checked = !!list[k];
            return `
              <li class="track-item ${checked ? "done" : ""}">
                <input type="checkbox" data-role="track-item" data-key="${k}" ${checked ? "checked" : ""} />
                <span class="track-text">${escapeHtml(text)}</span>
              </li>
            `;
          }).join("")}
        </ul>
      `;
    }

    function renderInteractiveRows(items, topicId, sectionKey) {
      const qa = loadQaStore();
      return items.map((item, idx) => {
        const k = qaKey(topicId, sectionKey, idx);
        const record = normalizeQaRecord(qa[k], { topicId, sectionKey, itemIndex: idx, context: item });
        const latest = record.history[record.history.length - 1] || null;
        const supplement = latest ? (latest.distilledRich || latest.distilledKeypoint || "") : "";
        const lastAnswer = latest ? latest.answer : "";
        const historyHtml = record.history.length
          ? `
            <div class="qa-history">
              <div class="qa-history-title">历史问答（${record.history.length}）</div>
              ${record.history.map((entry, hIdx) => `
                <div class="qa-history-item">
                  <div class="qa-history-q"><strong>Q${hIdx + 1}：</strong>${escapeHtml(entry.question || "（未记录问题）")}</div>
                  <div class="qa-history-a"><strong>A${hIdx + 1}：</strong>${escapeHtml(entry.answer || "（未返回回答）")}</div>
                  ${(entry.distilledRich || entry.distilledKeypoint) ? `<div class="qa-history-k"><strong>提炼：</strong>${renderRichSupplement(entry.distilledRich || entry.distilledKeypoint)}</div>` : ""}
                  ${entry.askedAt ? `<div class="qa-history-time">${escapeHtml(entry.askedAt)}</div>` : ""}
                </div>
              `).join("")}
            </div>
          `
          : "";
        return `
          <div class="knowledge-row">
            <div class="knowledge-main">
              <ul><li>${escapeHtml(item)}</li></ul>
              ${supplement ? `
                <div class="knowledge-extra">
                  <div class="extra-title">LLM提炼补充：</div>
                  ${renderRichSupplement(supplement)}
                </div>
              ` : ""}
            </div>
            <div class="knowledge-chat">
              <textarea data-role="qa-input" data-key="${k}" placeholder="对这个知识点有疑问？在这里提问..."></textarea>
              <div class="chat-actions">
                <button class="btn" data-role="qa-ask" data-key="${k}" data-topic="${topicId}" data-section="${sectionKey}" data-index="${idx}" data-context="${escapeHtml(item)}">提问LLM</button>
              </div>
              <div class="answer ${lastAnswer ? "" : "empty"}" data-role="qa-answer" data-key="${k}">${lastAnswer ? escapeHtml(lastAnswer) : "回答会显示在这里..."}</div>
              ${historyHtml}
            </div>
          </div>
        `;
      }).join("");
    }

    function fallbackBeginnerForTopic(topic) {
      if (Array.isArray(topic.aiBeginner) && topic.aiBeginner.length) {
        return topic.aiBeginner;

      return [
        `方向定义：${topic.title} 主要解决什么问题。`,
        "输入输出：先明确输入信息，再定义输出结果。",
        "评价标准：通过哪些指标判断你准备得是否有效。",
        "面试目标：能否在90秒内结构化表达该方向。"
      ];
    }

    function fallbackTextbookForTopic(topic) {
      const aiTextbook = topic.aiTextbook;
      if (aiTextbook && typeof aiTextbook === "object") {
        const ensureList = (value, fallback) => {
          if (Array.isArray(value) && value.length) return value;
          if (typeof value === "string" && value.trim()) return [value.trim()];
          return fallback;
        };
        return {
          core: ensureList(aiTextbook.core, ["先明确该方向在岗位中的业务价值。"]),
          framework: ensureList(aiTextbook.framework, ["定义问题 -> 构建框架 -> 给出可执行方案。"]),
          formula: String(aiTextbook.formula || "高质量回答 = 结构完整度 * 业务相关度 * 可执行性"),
          caseDemo: ensureList(aiTextbook.caseDemo, [`围绕“${topic.title}”准备1个真实场景：现状、问题、方案、结果。`]),
          pitfalls: ensureList(aiTextbook.pitfalls, ["只讲概念，不讲方法与落地。"]),
          script: String(aiTextbook.script || "我会先定义该方向的问题边界，再给拆解框架和行动方案，最后补风险和验证路径。")
        };
      }
      const hintLines = Array.isArray(topic.sourceHints) && topic.sourceHints.length
        ? topic.sourceHints.map((x) => `结合JD：${x}`)
        : ["未匹配到JD中的明确条目，建议在一级页面补充更细JD文本。"];
      return {
        core: [
          "先明确该方向在岗位中的业务价值。",
          "拆分核心问题：目标、约束、资源、风险。",
          ...hintLines
        ],
        framework: [
          "三段法：定义问题 -> 构建框架 -> 给出可执行方案。",
          "量化表达：至少包含1个指标、1个阈值、1个验证动作。"
        ],
        formula: "高质量回答 = 结构完整度 * 业务相关度 * 可执行性",
        caseDemo: [
          `围绕“${topic.title}”准备1个真实场景：现状、问题、方案、结果。`
        ],
        pitfalls: [
          "只讲概念，不讲方法与落地。",
          "只讲结论，不讲推导过程。"
        ],
        script: "我会先定义该方向的问题边界，再给拆解框架和行动方案，最后补风险和验证路径。"
      };
    }

    function bindTrackItemHandlers() {
      const boxes = topicDetailEl.querySelectorAll('[data-role="track-item"]');
      boxes.forEach((box) => {
        box.addEventListener("change", () => {
          const key = box.getAttribute("data-key");
          const list = loadChecklist();
          list[key] = box.checked;
          saveChecklist(list);
          renderSidebar();
          renderDetail();
          renderProgress();
        });
      });
    }

    function bindQaHandlers(topicId) {
      const askButtons = topicDetailEl.querySelectorAll('[data-role="qa-ask"]');
      askButtons.forEach((btn) => {
        btn.addEventListener("click", async () => {
          const key = btn.getAttribute("data-key");
          const context = btn.getAttribute("data-context") || "";
          const inputEl = topicDetailEl.querySelector(`[data-role="qa-input"][data-key="${key}"]`);
          const answerEl = topicDetailEl.querySelector(`[data-role="qa-answer"][data-key="${key}"]`);
          const question = (inputEl?.value || "").trim();
          if (!question) {
            answerEl.textContent = "请先输入问题。";
            answerEl.classList.remove("empty");
            return;
          }
          const config = loadLlmConfig();
          if (!config.endpoint || !config.model || !config.apiKey) {
            answerEl.textContent = "请先在一级页面配置模型与API Key后再提问。";
            answerEl.classList.remove("empty");
            return;
          }
          btn.disabled = true;
          answerEl.textContent = "LLM分析中...";
          answerEl.classList.remove("empty");
          try {
            const result = await callLLM(config, question, context);
            const richFromModel = (result.keypointMarkdown || "").trim();
            const tableFromAnswer = extractTableFromText(result.answer || "");
            const rich = richFromModel || tableFromAnswer;
            const qa = loadQaStore();
            const sectionKey = btn.getAttribute("data-section") || "";
            const itemIndex = Number(btn.getAttribute("data-index") || "0");
            const current = normalizeQaRecord(qa[key], {
              topicId,
              sectionKey,
              itemIndex,
              context
            });
            current.history.push({
              question,
              answer: result.answer,
              distilledKeypoint: result.keypoint,
              distilledRich: rich,
              askedAt: new Date().toLocaleString()
            });
            qa[key] = {
              topicId: current.topicId,
              sectionKey: current.sectionKey,
              itemIndex: current.itemIndex,
              context: current.context,
              history: current.history
            };
            saveQaStore(qa);
            if (inputEl) inputEl.value = "";
            renderDetail();
            renderSidebar();
            renderProgress();
          } catch (err) {
            answerEl.textContent = `LLM调用失败：${err.message}`;
          } finally {
            btn.disabled = false;
          }
        });
      });
    }

    function renderProgress() {
      if (!progressSummaryEl) return;
      let done = 0;
      let total = 0;
      let p0Done = 0;
      let p0Total = 0;
      topics.forEach((t) => {
        const stats = topicChecklistStats(t);
        done += stats.done;
        total += stats.total;
        if (t.priority === "P0") {
          p0Done += stats.done;
          p0Total += stats.total;
        }
      });
      progressSummaryEl.textContent = `总进度（知识点+动作）：${done}/${total}；核心P0进度：${p0Done}/${p0Total}。建议先把P0条目全部勾完。`;
    }

    function renderAll() {
      renderSidebar();
      renderDetail();
      renderProgress();
    }

    applyLevel1Handoff();
    initLlmTools();
    window.addEventListener("hashchange", renderAll);
    renderAll();
  </script>
</body>
</html>
